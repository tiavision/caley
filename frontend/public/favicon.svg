<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Blue outer background -->
  <rect width="128" height="128" rx="22" fill="#0172ad"/>
  <!-- White calendar body -->
  <rect x="12" y="36" width="104" height="80" rx="10" fill="#f0f8ff"/>
  <!-- Dark blue header bar -->
  <rect x="12" y="36" width="104" height="28" rx="10" fill="#014f80"/>
  <rect x="12" y="50" width="104" height="14" fill="#014f80"/>
  <!-- Ring binding pegs -->
  <rect x="34" y="22" width="12" height="26" rx="6" fill="white"/>
  <rect x="82" y="22" width="12" height="26" rx="6" fill="white"/>
  <!-- Day grid: 5 cols (x=14,35,56,77,98), 3 rows (y=70,84,98) -->
  <!-- Row 1, middle cell highlighted as "today" -->
  <rect x="14" y="70" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="35" y="70" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="56" y="70" width="16" height="11" rx="3" fill="#0172ad"/>
  <rect x="77" y="70" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="98" y="70" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <!-- Row 2 -->
  <rect x="14" y="84" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="35" y="84" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="56" y="84" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="77" y="84" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="98" y="84" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <!-- Row 3 (partial) -->
  <rect x="14" y="98" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="35" y="98" width="16" height="11" rx="3" fill="#bbd8ed"/>
  <rect x="56" y="98" width="16" height="11" rx="3" fill="#bbd8ed"/>
</svg>
