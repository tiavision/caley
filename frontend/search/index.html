<!doctype html>
<!-- q, start, end: the search form; flipped: calendarKey()s whose checkbox differs from the calendar's is_active;
     search: the submitted SearchQuery (src/lib/events.ts) the results load for.
     detail: the event <event-detail> shows. <event-form> wraps the page content that opens it. -->
<app-layout data-sn-prop="{ here: '/search/', title: 'Caley - Search' }"
            data-sn-state="{
              q: $url.q ?? '',
              detail: /** @type {EventJson|null} */ (null),
            }">
  <!-- The search in the URL (urlSearch(), src/lib/events.ts): one request, `cal` repeated for each chosen calendar,
       `active=1` for the default choice; it reads only $url, so the early file requests it on a reload. -->
  <sn-resource name="results" when="urlSearch($url).q"
               src="/search?q={urlSearch($url).q}&start={urlSearch($url).start}&end={urlSearch($url).end}&cal={urlSearch($url).cals}&active={urlSearch($url).active}"
 order="-dtstart"></sn-resource>
  <main data-gutter data-sn-state="{ defaultCal: '' }" data-sn-persist="event-default-calendar"
        data-sn-on-calendar-chosen="defaultCal = $event.detail">
    <event-form data-density="compact"
                data-sn-on-event-saved="refresh('results')" data-sn-on-event-deleted="refresh('results')">
      <div data-layout="stack" data-gap="md" data-pad="sm" data-sn-let="{ chosen: chosenCalendars(calendars, urlCals($url)) }">
        <div data-layout="row" data-gap="sm" data-wrap="none">
          <nav-toggle></nav-toggle>
          <!-- Submitting puts the words into the URL, which loads the search; the same words again reload it.
               The dates (models on $url) and calendars below write their URL parameters when changed: they apply at once. -->
          <form data-layout="row" data-gap="sm" data-wrap="none" data-grow
                data-sn-on-submit="$event.preventDefault();
                                   q.trim() && q.trim() === urlSearch($url).q && refresh('results');
                                   q.trim() && ($url.q = q.trim())">
            <input type="search" data-grow autofocus data-sn-model="q"
                   data-sn-attr="{placeholder: m.search_placeholder(), 'aria-label': m.search_placeholder()}">
            <button type="submit" data-icon="search" data-sn-text="m.search_submit()"></button>
          </form>
        </div>

        <div data-layout="row" data-gap="sm">
          <button type="button" popovertarget="search-calendars" data-variant="outline" data-size="sm"
                  data-sn-text="calendarsLabel(chosen.length, calendars.length)"></button>
          <div popover id="search-calendars" data-menu>
            <template data-sn-for="cal in calendars">
              <label>
                <input type="checkbox" data-sn-attr="{checked: chosen.includes(calendarKey(cal))}"
                       data-sn-on-change="$url.cals = calsParam(toggled(chosen, calendarKey(cal)), calendars)">
                <span class="event-color-dot" data-sn-show="cal.color" data-sn-style="{'--tm-tone': cal.color}"></span>
                <span data-sn-text="cal.name"></span>
              </label>
            </template>
          </div>

          <label data-layout="row" data-gap="xs">
            <small data-muted data-sn-text="m.search_from()"></small>
            <input type="date" data-size="sm" data-sn-model="$url.start">
          </label>
          <label data-layout="row" data-gap="xs">
            <small data-muted data-sn-text="m.search_to()"></small>
            <input type="date" data-size="sm" data-sn-model="$url.end">
          </label>
        </div>

        <!-- A new search keeps the last results, dimmed, with a bar above them; the text only while there are none. -->
        <div class="search-progress">
          <template data-sn-if="$meta.results.loading && results.length > 0">
            <progress data-sn-attr="{'aria-label': m.search_loading()}"></progress>
          </template>
        </div>
        <template data-sn-if="$meta.results.loading && !results.length">
          <p aria-busy="true" aria-live="polite" data-sn-text="m.search_loading()"></p>
        </template>
        <template data-sn-else>
          <template data-sn-if="$meta.results.error && !$meta.results.loading">
            <p data-tone="danger" aria-live="polite" data-sn-text="m.search_error()"></p>
          </template>
          <template data-sn-else>
            <template data-sn-if="urlSearch($url).q && $meta.results.loadedAt && !$meta.results.loading && !results.length">
              <p data-muted aria-live="polite" data-sn-text="m.search_noResults()"></p>
            </template>
            <template data-sn-else>
              <ul data-list aria-live="polite" data-sn-show="results.length > 0"
                  data-sn-attr="{'aria-busy': $meta.results.loading ? 'true' : null}">
                <template data-sn-for="item in results">
                  <li data-pad="none">
                    <button type="button" class="search-result" data-variant="item" data-layout="stack" data-gap="none"
                            data-sn-attr="{'data-bar': item.color ? '' : null}" data-sn-style="{'--tm-tone': item.color || null}"
                            data-sn-on-click="detail = item; showModal('event-detail')">
                      <strong data-sn-text="item.summary"></strong>
                      <small data-muted data-sn-text="eventDateLong(item.dtstart, $locale) + (item.location ? ` · ${item.location}` : '')"></small>
                      <template data-sn-if="item.description">
                        <small data-muted data-truncate data-sn-text="item.description"></small>
                      </template>
                      <template data-sn-if="calendarName(calendars, item)">
                        <small data-caption data-sn-text="calendarName(calendars, item)"></small>
                      </template>
                    </button>
                  </li>
                </template>
              </ul>
            </template>
          </template>
        </template>
      </div>

      <event-detail data-sn-prop="{ event: detail }"></event-detail>
    </event-form>
  </main>
  <script type="module" src="/src/main/search.ts"></script>
</app-layout>
