<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Caley - Search</title>
  </head>
  <!-- q, start, end: the search form; flipped: calendarKey()s whose checkbox differs from the calendar's is_active;
       search: the submitted SearchQuery (src/lib/events.ts) the results load for.
       detail, eventDraft: partials/event-detail.html and partials/event-form.html. -->
  <body data-shell="fixed"
        data-sn-state="{
          here: '/search/',
          q: '',
          start: '',
          end: '',
          flipped: /** @type {string[]} */ ([]),
          search: /** @type {SearchQuery|null} */ (null),
          detail: /** @type {EventJson|null} */ (null),
          eventDraft: /** @type {EventDraft|null} */ (null),
        }"
        data-sn-on-event-edit="eventDraft = editEventDraft($event.detail.event, $event.detail.scope); showModal('event-form')"
        data-sn-on-event-saved="refresh('results')"
        data-sn-on-event-deleted="refresh('results')">
    <sn-include src="../partials/nav.html"></sn-include>
    <!-- One request: `cal` repeated for each chosen calendar; none chosen searches all. -->
    <sn-resource name="results" when="search"
                 src="/api/search?q={search.q}&start={search.start || null}&end={search.end || null}&cal={search.cals}"
                 key="account_id,calendar_href,uid,dtstart" order="-dtstart" type="EventJson[]"></sn-resource>
    <main data-sn-state="{ defaultCal: '' }" data-sn-persist="event-default-calendar">
      <div data-density="compact" data-sn-let="{ eventThreads: false, chosen: chosenCalendars(calendars, flipped) }">
        <div data-layout="stack" data-gap="md" data-pad="sm">
          <div data-layout="row" data-gap="sm" data-wrap="none">
            <sn-include src="../partials/nav-toggle.html"></sn-include>
            <!-- Submitting the search shown again reloads it. -->
            <form data-layout="row" data-gap="sm" data-wrap="none" data-grow
                  data-sn-let="{ query: searchQuery(q, start, end, chosen) }"
                  data-sn-on-submit="$event.preventDefault();
                                     query.q && sameSearch(search, query) && refresh('results');
                                     search = submittedSearch(search, query)">
              <input type="search" data-grow autofocus data-sn-model="q"
                     data-sn-attr="{placeholder: m.search_placeholder(), 'aria-label': m.search_placeholder()}">
              <button type="submit" data-icon="search" data-sn-text="m.search_submit()"></button>
            </form>
          </div>

          <div data-layout="row" data-gap="sm">
            <button type="button" popovertarget="search-calendars" data-variant="outline" data-size="sm"
                    data-sn-text="calendarsLabel(chosen.length, calendars.length)"></button>
            <div popover id="search-calendars" data-menu>
              <template data-sn-for="cal in calendars">
                <label>
                  <input type="checkbox" data-sn-attr="{checked: chosen.includes(calendarKey(cal))}"
                         data-sn-on-change="flipped = toggled(flipped, calendarKey(cal))">
                  <span class="event-color-dot" data-sn-show="cal.color" data-sn-style="{'--tm-tone': cal.color}"></span>
                  <span data-sn-text="cal.name"></span>
                </label>
              </template>
            </div>

            <label data-layout="row" data-gap="xs">
              <small data-muted data-sn-text="m.search_from()"></small>
              <input type="date" data-size="sm" data-sn-model="start">
            </label>
            <label data-layout="row" data-gap="xs">
              <small data-muted data-sn-text="m.search_to()"></small>
              <input type="date" data-size="sm" data-sn-model="end">
            </label>
          </div>

          <template data-sn-if="$meta.results.loading">
            <p aria-busy="true" aria-live="polite" data-sn-text="m.search_loading()"></p>
          </template>
          <template data-sn-else>
            <template data-sn-if="$meta.results.error">
              <p data-tone="danger" aria-live="polite" data-sn-text="m.search_error()"></p>
            </template>
            <template data-sn-else>
              <template data-sn-if="search && $meta.results.loadedAt && !results.length">
                <p data-muted aria-live="polite" data-sn-text="m.search_noResults()"></p>
              </template>
              <template data-sn-else>
                <ul data-list aria-live="polite" data-sn-show="results.length > 0">
                  <template data-sn-for="item in results">
                    <li data-pad="none">
                      <button type="button" class="search-result" data-variant="item" data-layout="stack" data-gap="none"
                              data-sn-attr="{'data-bar': item.color ? '' : null}" data-sn-style="{'--tm-tone': item.color || null}"
                              data-sn-on-click="detail = item; showModal('event-detail')">
                        <strong data-sn-text="item.summary"></strong>
                        <small data-muted data-sn-text="eventDateLong(item.dtstart, $locale) + (item.location ? ` · ${item.location}` : '')"></small>
                        <template data-sn-if="item.description">
                          <small data-muted data-truncate data-sn-text="item.description"></small>
                        </template>
                        <template data-sn-if="calendarName(calendars, item)">
                          <small data-caption data-sn-text="calendarName(calendars, item)"></small>
                        </template>
                      </button>
                    </li>
                  </template>
                </ul>
              </template>
            </template>
          </template>
        </div>

        <sn-include src="../partials/event-detail.html"></sn-include>
        <sn-include src="../partials/event-form.html"></sn-include>
      </div>
    </main>
    <script type="module" src="/src/main/search.ts"></script>
  </body>
</html>
