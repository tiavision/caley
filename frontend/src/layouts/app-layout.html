<!-- The document of the app pages with the navigation rail (/calendar/, /contacts/, /mail/, /search/, /settings/):
     the head, the fixed shell, the `user` resource and the rail (src/components/app-nav.html). A page is this tag:
       <app-layout data-sn-with="{ here: '/mail/', title: mailTitle(unread) }" data-sn-state="{ … }" data-sn-on-…>
         …resources, <main>, <script type="module" src="/src/main/<page>.ts"></script>
       </app-layout>
     `here` marks the page's rail item. The page reads `user` (map_url, …) and never declares it again. -->
<!doctype html>
<html lang="en" data-sn-props="{ here: string; title?: string }">
<head>
  <app-head data-sn-with="{ title }"></app-head>
  <slot name="head"></slot>
</head>
<body data-tm-shell="fixed">
  <sn-resource name="user" src="/user"></sn-resource>
  <app-nav data-sn-with="{ here }"></app-nav>
  <slot></slot>
</body>
</html>
