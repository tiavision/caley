<!-- The reader's subject row (mail-header-fit.ts). When the subject (.detail-subject-line) and the controls
     (.detail-controls) do not fit on one line, it is `stacked`: controls on the first line, the whole subject below
     (mail.scss). -->
<template data-sn-component="">
  <div data-sn-state="{ stacked: false }" data-sn-class="{ stacked }"><slot></slot></div>
</template>
