<!-- The width the reader gives a mail (email-width.ts): `narrow` (true below 640px, a phone) when it changes, so the
     reader parses the mail's @media rules for a narrow screen (sinter-mail's `media: 'narrow'`, 375px), as mail apps
     on phones do. Its root is an empty block as wide as the reader. -->
<template data-sn-component="" data-sn-emits="{ narrow: boolean }">
  <div class="email-width" aria-hidden="true"></div>
</template>
