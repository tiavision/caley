<!-- Next to the month grid (`.month-grid` in the same parent): after each change of the events (`data`) and each
     resize it reports in `fit` how many chips fit each cell (month-fit.ts). -->
<template data-sn-props="{ data: DayEventsJson[] | null }" data-sn-emits="{ fit: MonthFit }">
  <span hidden></span>
</template>
