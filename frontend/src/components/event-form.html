<!-- New/edit event dialog #event-form with the recurrence builder. It wraps the part of the page that opens it,
     and takes its draft (EventDraft, src/lib/events.ts) from the events its content emits:
       - `event-new` (EventDraft): emit('event-new', newEventDraft(calendars, date, defaultCal));
       - `event-edit` {event, scope} from <event-detail>.
     It declares the `calendars` (CalendarJson[]) and `caldavAccounts` resources: the page reads them, never redeclares them.
     Events: `event-saved` and `event-deleted` (the draft) after the server accepted the change; `calendar-chosen`
     (a calendar key) when a calendar is picked or a new event saved: the page remembers it as its default calendar. -->
<template data-sn-props=""
          data-sn-emits="{ 'event-new': EventDraft; 'event-saved': EventDraft; 'event-deleted': EventDraft; 'calendar-chosen': string }">
  <div data-sn-state="{ draft: /** @type {EventDraft|null} */ (null), eventError: '', summaryHints: false, attendeeRow: -1, attendeeQuery: '', edited: false }"
       data-sn-on-event-new="draft = $event.detail; openDialog('event-form')"
       data-sn-on-event-edit="draft = editEventDraft($event.detail.event, $event.detail.scope); openDialog('event-form')">
    <sn-resource name="calendars" src="/calendars"></sn-resource>
    <sn-resource name="caldavAccounts" src="/caldav/accounts"></sn-resource>
    <!-- attendee suggestions: loaded when the form first opens -->
    <sn-resource name="attendeeContacts" src="/contacts" select="contacts" key="account_id,uid,addressbook_href" when="draft"></sn-resource>
    <slot></slot>
    <!-- Leaving the page while the open form has been edited (Back or Forward: the modal keeps the page's links out
         of reach) is refused, with a note: save or discard first. An event runs only the nearest handler, so a
         field with its own input or change handler sets `edited` there too. -->
    <dialog id="event-form" closedby="any"
            data-sn-on-toggle="$el.open && $el.querySelector('input')?.select()"
            data-sn-on-input="edited = true" data-sn-on-change="edited = true"
            data-sn-on-sn-navigate="edited && $event.preventDefault(); edited && (eventError = m.draft_leave())"
            data-sn-on-close="eventError = ''; summaryHints = false; attendeeRow = -1; edited = false">
      <header>
        <h2 data-sn-text="draft?.mode === 'edit' ? m.event_edit() : m.event_create()"></h2>
        <button type="button" commandfor="event-form" command="close" data-sn-attr="{'aria-label': m.weekly_aria_close()}"></button>
      </header>

      <template data-sn-if="eventError">
        <div data-tm-callout data-tm-tone="danger" role="alert" data-sn-text="eventError"></div>
      </template>

      <template data-sn-if="draft">
        <form data-tm-layout="stack" data-tm-gap="md"
              data-sn-post="/event" data-sn-encoding="form" data-sn-body="eventFormBody(draft)"
              data-sn-then="draft.mode === 'create' && emit('calendar-chosen', draft.cal); closeDialog(); emit('event-saved', draft)"
              data-sn-catch="eventError = $error.detail ?? m.event_error()">
          <label>
            <span data-sn-text="m.event_summary()"></span>
            <div data-tm-combo data-sn-let="{ hints: summaryHints ? summarySuggestions(draft.summary, $locale, $now) : [] }">
              <input type="text" required autofocus data-sn-model="draft.summary" data-sn-options="event-summary-suggestions"
                     data-sn-attr="{'aria-expanded': hints.length > 0 ? 'true' : 'false'}"
                     data-sn-on-input="edited = true; summaryHints = true"
                     data-sn-on-sn-dismiss="summaryHints = false"
                     data-sn-on-blur="summaryHints = false">
              <div data-tm-menu role="listbox" id="event-summary-suggestions" data-sn-show="hints.length > 0">
                <template data-sn-for="(s, i) in hints" data-sn-key="i">
                  <div role="option" tabindex="-1" data-sn-text="s.label"
                       data-sn-on-click="draft = applySummarySuggestion(draft, s); summaryHints = false"></div>
                </template>
              </div>
            </div>
          </label>

          <div data-tm-layout="row" data-tm-gap="md" data-tm-align="end">
            <label data-tm-grow>
              <span data-sn-text="m.event_date()"></span>
              <input type="date" required data-sn-model="draft.date">
            </label>
            <label data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none">
              <input type="checkbox" role="switch" data-sn-model="draft.is_all_day">
              <span data-sn-text="m.event_allDay()"></span>
            </label>
          </div>
          <template data-sn-if="!draft.is_all_day">
            <div data-tm-layout="grid" data-tm-gap="sm" style="--tm-min: 9rem">
              <label>
                <span data-sn-text="m.event_startTime()"></span>
                <input type="time" data-sn-model="draft.start_time"
                       data-sn-on-change="edited = true; !draft.end_time && $el.value && (draft.end_time = halfHourAfter($el.value))">
              </label>
              <label>
                <span data-sn-text="m.event_endTime()"></span>
                <input type="time" data-sn-model="draft.end_time">
              </label>
            </div>
          </template>

          <label>
            <span data-sn-text="m.event_location()"></span>
            <input type="text" data-sn-model="draft.location">
          </label>

          <label>
            <span data-sn-text="m.event_description()"></span>
            <textarea rows="3" data-sn-model="draft.description"></textarea>
          </label>

          <fieldset data-tm-layout="stack" data-tm-gap="sm">
            <legend data-sn-text="m.event_reminder()"></legend>
            <template data-sn-for="(alarm, i) in draft.alarms">
              <div data-tm-layout="row" data-tm-gap="sm">
                <template data-sn-if="alarm.direction !== 'absolute'">
                  <input type="number" min="1" class="event-num" data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="draft.alarms[i].value">
                  <select class="event-unit" data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="draft.alarms[i].unit">
                    <option value="1" data-sn-text="m.event_reminderMin()"></option>
                    <option value="60" data-sn-text="m.event_reminderHours()"></option>
                    <option value="1440" data-sn-text="m.event_reminderDays()"></option>
                  </select>
                </template>
                <template data-sn-else>
                  <input type="datetime-local" data-tm-grow data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="draft.alarms[i].datetime">
                </template>
                <select data-tm-grow data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="draft.alarms[i].direction">
                  <option value="before-start" data-sn-text="m.event_reminderBeforeStart()"></option>
                  <option value="before-end" data-sn-text="m.event_reminderBeforeEnd()"></option>
                  <option value="after-start" data-sn-text="m.event_reminderAfterStart()"></option>
                  <option value="after-end" data-sn-text="m.event_reminderAfterEnd()"></option>
                  <option value="absolute" data-sn-text="m.event_reminderAtTime()"></option>
                </select>
                <button type="button" data-tm-variant="ghost" data-tm-icon="x" data-sn-attr="{'aria-label': m.event_reminderRemove()}"
                        data-sn-on-click="draft.alarms.splice(i, 1)"></button>
              </div>
            </template>
            <button type="button" data-tm-variant="secondary" data-tm-size="sm" data-tm-icon="plus" data-tm-self="start"
                    data-sn-on-click="draft.alarms.push(newAlarm())" data-sn-text="m.event_reminderAdd()"></button>
          </fieldset>

          <fieldset data-tm-layout="stack" data-tm-gap="sm">
            <legend data-sn-text="m.event_attendees()"></legend>
            <template data-sn-for="(att, i) in draft.attendees">
              <div data-tm-layout="row" data-tm-gap="sm" style="--tm-grow-basis: 6rem"
                   data-sn-let="{ hits: attendeeRow === i ? attendeeSuggestions(attendeeContacts, attendeeQuery) : [] }">
                <div data-tm-combo data-tm-grow>
                  <input type="text" data-sn-options data-sn-model="draft.attendees[i].cn"
                         data-sn-attr="{placeholder: m.event_attendeeName(), 'aria-label': m.event_attendeeName(), 'aria-expanded': hits.length > 0 ? 'true' : 'false'}"
                         data-sn-on-input="edited = true; attendeeRow = i; attendeeQuery = $el.value"
                         data-sn-on-sn-dismiss="attendeeRow = -1" data-sn-on-blur="attendeeRow = -1">
                  <div data-tm-menu role="listbox" data-sn-show="hits.length > 0">
                    <template data-sn-for="(s, j) in hits" data-sn-key="j">
                      <div role="option" tabindex="-1" data-sn-text="attendeeLabel(s)"
                           data-sn-on-click="draft.attendees[i].cn = s.cn; draft.attendees[i].email = s.email; attendeeRow = -1"></div>
                    </template>
                  </div>
                </div>
                <div data-tm-combo data-tm-grow class="event-attendee-email">
                  <input type="email" data-sn-options data-sn-model="draft.attendees[i].email"
                         data-sn-attr="{placeholder: m.event_attendeeEmail(), 'aria-label': m.event_attendeeEmail(), 'aria-expanded': hits.length > 0 ? 'true' : 'false'}"
                         data-sn-on-input="edited = true; attendeeRow = i; attendeeQuery = $el.value"
                         data-sn-on-sn-dismiss="attendeeRow = -1" data-sn-on-blur="attendeeRow = -1">
                  <div data-tm-menu role="listbox" data-sn-show="hits.length > 0">
                    <template data-sn-for="(s, j) in hits" data-sn-key="j">
                      <div role="option" tabindex="-1" data-sn-text="attendeeLabel(s)"
                           data-sn-on-click="draft.attendees[i].cn = s.cn; draft.attendees[i].email = s.email; attendeeRow = -1"></div>
                    </template>
                  </div>
                </div>
                <select class="event-partstat" data-sn-attr="{'aria-label': m.event_attendees()}" data-sn-model="draft.attendees[i].partstat">
                  <option value="NEEDS-ACTION" data-sn-text="m.event_attendeeStatusNeedsAction()"></option>
                  <option value="ACCEPTED" data-sn-text="m.event_attendeeStatusAccepted()"></option>
                  <option value="DECLINED" data-sn-text="m.event_attendeeStatusDeclined()"></option>
                  <option value="TENTATIVE" data-sn-text="m.event_attendeeStatusTentative()"></option>
                </select>
                <button type="button" data-tm-variant="ghost" data-tm-icon="x" data-sn-attr="{'aria-label': m.event_attendeeRemove()}"
                        data-sn-on-click="draft.attendees.splice(i, 1); attendeeRow = -1"></button>
              </div>
            </template>
            <button type="button" data-tm-variant="secondary" data-tm-size="sm" data-tm-icon="plus" data-tm-self="start"
                    data-sn-on-click="draft.attendees.push(newAttendee())" data-sn-text="m.event_attendeeAdd()"></button>
          </fieldset>

          <!-- Recurrence (was RecurrenceBuilder.svelte) -->
          <template data-sn-if="draft.scope !== 'this_instance'">
            <label>
              <span data-sn-text="m.event_repeat()"></span>
              <select data-sn-model="draft.rec.freq">
                <option value="" data-sn-text="m.event_repeatNone()"></option>
                <option value="DAILY" data-sn-text="m.event_repeatDaily()"></option>
                <option value="WEEKLY" data-sn-text="m.event_repeatWeekly()"></option>
                <option value="MONTHLY" data-sn-text="m.event_repeatMonthly()"></option>
                <option value="YEARLY" data-sn-text="m.event_repeatYearly()"></option>
              </select>
            </label>
          </template>
          <template data-sn-else>
            <small data-tm-muted data-sn-text="m.event_repeatInstanceNote()"></small>
          </template>

          <template data-sn-if="draft.rec.freq">
            <div data-tm-layout="stack" data-tm-gap="md">
              <fieldset>
                <legend data-sn-text="m.event_repeatEvery()"></legend>
                <div data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none">
                  <input type="number" min="1" class="event-num" data-sn-attr="{'aria-label': m.event_repeatEvery()}" data-sn-model="draft.rec.interval">
                  <span data-sn-text="intervalUnit(draft.rec.freq)"></span>
                </div>
              </fieldset>

              <template data-sn-if="draft.rec.freq === 'WEEKLY'">
                <fieldset>
                  <legend data-sn-text="m.event_repeatOn()"></legend>
                  <div data-tm-layout="row" data-tm-gap="xs">
                    <template data-sn-for="d in weekdays()" data-sn-key="d.code">
                      <button type="button" data-tm-variant="outline" data-tm-size="sm"
                              data-sn-attr="{'aria-pressed': draft.rec.by_day.includes(d.code) ? 'true' : 'false'}"
                              data-sn-on-click="draft.rec.by_day = toggled(draft.rec.by_day, d.code)"
                              data-sn-text="d.label"></button>
                    </template>
                  </div>
                </fieldset>
              </template>

              <template data-sn-if="draft.rec.freq === 'MONTHLY'">
                <fieldset>
                  <legend data-sn-text="m.event_repeatOn()"></legend>
                  <div data-tm-layout="row" data-tm-gap="sm">
                    <label><input type="radio" name="monthly_mode" value="by_day" data-sn-model="draft.rec.monthly_mode"> <span data-sn-text="m.event_monthlyByDay()"></span></label>
                    <input type="number" min="1" max="31" class="event-num" data-sn-model="draft.rec.monthday"
                           data-sn-attr="{'aria-label': m.event_monthlyByDay(), disabled: draft.rec.monthly_mode !== 'by_day'}">
                  </div>
                  <div data-tm-layout="row" data-tm-gap="sm">
                    <label><input type="radio" name="monthly_mode" value="by_setpos" data-sn-model="draft.rec.monthly_mode"> <span data-sn-text="m.event_monthlyByPos()"></span></label>
                    <select data-sn-model="draft.rec.setpos"
                            data-sn-attr="{'aria-label': m.event_monthlyByPos(), disabled: draft.rec.monthly_mode !== 'by_setpos'}">
                      <option value="1" data-sn-text="m.event_monthlyPos1()"></option>
                      <option value="2" data-sn-text="m.event_monthlyPos2()"></option>
                      <option value="3" data-sn-text="m.event_monthlyPos3()"></option>
                      <option value="4" data-sn-text="m.event_monthlyPos4()"></option>
                      <option value="-1" data-sn-text="m.event_monthlyPosLast()"></option>
                    </select>
                    <select data-sn-model="draft.rec.setpos_day"
                            data-sn-attr="{'aria-label': m.event_repeatOn(), disabled: draft.rec.monthly_mode !== 'by_setpos'}">
                      <template data-sn-for="d in weekdays()" data-sn-key="d.code">
                        <option data-sn-attr="{value: d.code}" data-sn-text="d.label"></option>
                      </template>
                    </select>
                  </div>
                </fieldset>
              </template>

              <fieldset>
                <legend data-sn-text="m.event_repeatEnd()"></legend>
                <label><input type="radio" name="rrule_end_type" value="never" data-sn-model="draft.rec.end_type"> <span data-sn-text="m.event_repeatEndNever()"></span></label>
                <div data-tm-layout="row" data-tm-gap="sm">
                  <label><input type="radio" name="rrule_end_type" value="count" data-sn-model="draft.rec.end_type"> <span data-sn-text="m.event_repeatEndAfter()"></span></label>
                  <input type="number" min="1" class="event-num" data-sn-model="draft.rec.count"
                         data-sn-attr="{'aria-label': m.event_repeatEndAfterN(), disabled: draft.rec.end_type !== 'count'}">
                  <span data-sn-text="m.event_repeatEndAfterN()"></span>
                </div>
                <div data-tm-layout="row" data-tm-gap="sm">
                  <label><input type="radio" name="rrule_end_type" value="until" data-sn-model="draft.rec.end_type"> <span data-sn-text="m.event_repeatEndOn()"></span></label>
                  <input type="date" data-tm-grow data-sn-model="draft.rec.until"
                         data-sn-attr="{'aria-label': m.event_repeatEndOn(), disabled: draft.rec.end_type !== 'until'}">
                </div>
              </fieldset>
            </div>
          </template>

          <label>
            <span data-sn-text="m.event_calendar()"></span>
            <select data-sn-model="draft.cal" data-sn-attr="{disabled: draft.scope === 'this_instance'}"
                    data-sn-on-change="edited = true; emit('calendar-chosen', $el.value)">
              <template data-sn-for="g in calendarGroups(calendars, caldavAccounts)" data-sn-key="g.account_id">
                <optgroup data-sn-attr="{label: g.label}">
                  <template data-sn-for="cal in g.calendars">
                    <option data-sn-attr="{value: calendarKey(cal)}" data-sn-text="cal.name"></option>
                  </template>
                </optgroup>
              </template>
            </select>
          </label>

          <footer data-tm-layout="row" data-tm-gap="sm">
            <template data-sn-if="draft.mode === 'edit'">
              <button type="button" data-tm-variant="ghost" data-tm-tone="danger" data-tm-icon="trash-2"
                      data-sn-delete="/event?account_id={draft.cal.split('\0')[0]}&uid={draft.uid}&calendar_href={draft.cal.split('\0')[1]}&scope={draft.scope === 'this_instance' && draft.original_dtstart ? 'this_instance' : null}&original_dtstart={draft.scope === 'this_instance' && draft.original_dtstart ? draft.original_dtstart : null}&tz={draft.scope === 'this_instance' && draft.original_dtstart ? draft.original_tz : null}"
                      data-sn-confirm="m.event_deleteConfirm()"
                      data-sn-then="closeDialog('event-form'); emit('event-deleted', draft)"
                      data-sn-catch="eventError = $error.detail ?? m.event_error()"
                      data-sn-text="m.event_delete()"></button>
              <span data-tm-grow></span>
            </template>
            <button type="button" data-tm-variant="ghost" commandfor="event-form" command="close" data-sn-text="m.event_cancel()"></button>
            <button type="submit" data-sn-text="m.event_save()"></button>
          </footer>
        </form>
      </template>
    </dialog>
  </div>
</template>

<!-- The root only holds the dialog's state and handlers: it takes no part in the layout. -->
<style>
  :scope { display: contents; }
</style>
