<!-- The icon of a mailbox kind (folderKind()). Static icon names, so temper serves them. -->
<template data-sn-props="{ kind: string }">
  <span class="folder-icon">
    <span data-tm-icon="inbox" aria-hidden="true" data-sn-show="kind === 'inbox'"></span>
    <span data-tm-icon="send" aria-hidden="true" data-sn-show="kind === 'sent'"></span>
    <span data-tm-icon="pencil" aria-hidden="true" data-sn-show="kind === 'drafts'"></span>
    <span data-tm-icon="trash-2" aria-hidden="true" data-sn-show="kind === 'trash'"></span>
    <span data-tm-icon="octagon-alert" aria-hidden="true" data-sn-show="kind === 'junk'"></span>
    <span data-tm-icon="archive" aria-hidden="true" data-sn-show="kind === 'archive'"></span>
    <span data-tm-icon="folder" aria-hidden="true" data-sn-show="kind === 'folder'"></span>
  </span>
</template>
