<!-- Image sources dialog #email-origins (/mail/ and /mail/view/): the allowed and ignored image origins, or with
     `only` those of the open message (blocked ones too). It wraps the part of the page that opens it; an opener emits
     `origins-open` with the open message's image origins to show only those (emit('origins-open', tree.images.origins)),
     or null for all of them. Resources: allowedOrigins, ignoredOrigins. -->
<template data-sn-props="" data-sn-emits="{ 'origins-open': string[] | null }">
  <div data-sn-state="{ only: false, mailOrigins: /** @type {string[]} */ ([]), q: '' }"
       data-sn-on-origins-open="only = !!$event.detail; mailOrigins = $event.detail ?? []; q = ''; openDialog('email-origins')">
    <slot></slot>
    <dialog id="email-origins" closedby="any"
            data-sn-let="{
              allowed: allowedOrigins?.origins ?? [],
              ignored: ignoredOrigins?.origins ?? [],
              inMail: bodyOrigins(mailOrigins, allowed, ignored),
            }">
      <header>
        <h2 data-sn-text="only ? m.mail_imageSourcesThisEmail() : m.mail_imageSources()"></h2>
        <button type="button" commandfor="email-origins" command="close" data-sn-attr="{'aria-label': m.mail_close()}"></button>
      </header>
      <div data-tm-field>
        <span data-tm-icon="search" aria-hidden="true"></span>
        <input type="search" data-sn-model="q" data-sn-attr="{placeholder: m.mail_originsFilter(), 'aria-label': m.mail_originsFilter()}">
      </div>
      <template data-sn-if="only">
        <section data-tm-layout="stack" data-tm-gap="xs" data-sn-let="{ shownOrigins: matching(inMail.blocked, q) }">
          <h3 data-tm-caption data-sn-text="m.mail_originsBlocked()"></h3>
          <template data-sn-if="shownOrigins.length === 0">
            <p data-tm-muted data-sn-text="q ? m.mail_originsNoMatches() : m.mail_originsNoneBlockedEmail()"></p>
          </template>
          <template data-sn-else>
            <ul data-tm-list>
              <template data-sn-for="origin in shownOrigins" data-sn-key="origin">
                <li data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none" data-tm-pad="xs">
                  <span data-tm-truncate data-tm-grow data-sn-text="origin"></span>
                  <button type="button" data-tm-variant="outline" data-tm-tone="accent" data-tm-size="sm"
                          data-sn-post="/email/image-origins" data-sn-body="{origin}" data-sn-then="refresh(allowedOrigins)"
                          data-sn-text="m.mail_originsAllow()"></button>
                  <button type="button" data-tm-variant="ghost" data-tm-size="sm" data-tm-icon="ban" data-tm-tooltip
                          data-sn-post="/email/image-blacklist" data-sn-body="{origin}" data-sn-then="refresh(ignoredOrigins)"
                          data-sn-attr="{'aria-label': m.mail_blockSilently()}"></button>
                </li>
              </template>
            </ul>
          </template>
        </section>
      </template>
      <section data-tm-layout="stack" data-tm-gap="xs" data-sn-let="{ shownOrigins: matching(only ? inMail.allowed : allowed, q) }">
        <h3 data-tm-caption data-sn-text="m.mail_originsAllowed()"></h3>
        <template data-sn-if="shownOrigins.length === 0">
          <p data-tm-muted data-sn-text="q ? m.mail_originsNoMatches() : m.mail_originsNoneYet()"></p>
        </template>
        <template data-sn-else>
          <ul data-tm-list>
            <template data-sn-for="origin in shownOrigins" data-sn-key="origin">
              <li data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none" data-tm-pad="xs">
                <span data-tm-truncate data-tm-grow data-sn-text="origin"></span>
                <button type="button" data-tm-variant="ghost" data-tm-size="sm" data-tm-icon="x" data-tm-tooltip
                        data-sn-delete="/email/image-origins?origin={origin}" data-sn-then="refresh(allowedOrigins)"
                        data-sn-attr="{'aria-label': m.mail_removeAttachment()}"></button>
              </li>
            </template>
          </ul>
        </template>
      </section>
      <section data-tm-layout="stack" data-tm-gap="xs" data-sn-let="{ shownOrigins: matching(only ? inMail.ignored : ignored, q) }">
        <h3 data-tm-caption data-sn-text="m.mail_originsIgnored()"></h3>
        <template data-sn-if="shownOrigins.length === 0">
          <p data-tm-muted data-sn-text="q ? m.mail_originsNoMatches() : m.mail_originsNoneYet()"></p>
        </template>
        <template data-sn-else>
          <ul data-tm-list>
            <template data-sn-for="origin in shownOrigins" data-sn-key="origin">
              <li data-tm-layout="row" data-tm-gap="sm" data-tm-wrap="none" data-tm-pad="xs">
                <span data-tm-truncate data-tm-grow data-sn-text="origin"></span>
                <!-- Allow: onto the allow list, which takes it off the ignore list (POST /email/image-origins). -->
                <button type="button" data-tm-variant="outline" data-tm-tone="accent" data-tm-size="sm"
                        data-sn-post="/email/image-origins" data-sn-body="{origin}" data-sn-then="refresh(allowedOrigins, ignoredOrigins)"
                        data-sn-text="m.mail_originsAllow()"></button>
                <button type="button" data-tm-variant="ghost" data-tm-size="sm" data-tm-icon="x" data-tm-tooltip
                        data-sn-delete="/email/image-blacklist?origin={origin}" data-sn-then="refresh(ignoredOrigins)"
                        data-sn-attr="{'aria-label': m.mail_removeAttachment()}"></button>
              </li>
            </template>
          </ul>
        </template>
      </section>
    </dialog>
  </div>
</template>

<!-- The root only holds the dialog's state and handlers: it takes no part in the layout. -->
<style>
  :scope { display: contents; }
</style>
