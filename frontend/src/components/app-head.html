<!-- The head every page shares: charset, viewport, color scheme, icons, web app manifest and the tab title
     (`title`, `Caley` without one). Used by src/layouts/app-layout.html and the pages with their own document
     (the login page, /mail/view/). -->
<template data-sn-head="{ title?: string }">
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <title data-sn-text="title ?? 'Caley'">Caley</title>
</template>
