<!-- A column resize handle (mail-split.ts). Dragging it emits `split-resize` with the new width; `width` is the width
     when the drag starts. The arrow keys are the page's (keyWidth helper, a handler on the tag). -->
<template data-sn-component="{ width: number }" data-sn-emits="{ 'split-resize': number }">
  <div data-sn-state="{ dragging: false }" data-sn-class="{ dragging }"></div>
</template>
