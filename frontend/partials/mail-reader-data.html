<!-- The reader's resources (partials/mail-reader.html), included once at page level where the page state declares
     `open` (MessageRef|null), `threadRef` (ThreadRef|null, partials/thread-dialog.html) and `wiped` (the key of the encrypted message whose decrypted content was dropped while the page was hidden, or ''). -->
<sn-resource name="message" call="mail.open(open)" when="open" type="Message"></sn-resource>
<!-- Once the body is there, an unread message is marked read (#mark-read); the read message keeps later loads of the
     body (unlock, key import) from marking it again. -->
<sn-resource name="body" call="mail.body(open)" when="open && wiped !== messageKey(open)"
             then="$result && message && !message.is_read && run('mark-read')"></sn-resource>
<span hidden id="mark-read" data-sn-patch="/api/email/message/flags" data-sn-retry="flags" data-sn-body="flagBody(open, '\\Seen', true)"
      data-sn-optimistic="patch('message', message, markedRead(message))"></span>
<sn-resource name="thread" src="/api/email/thread?account_id={open.account_id}&mailbox={open.mailbox}&uid={open.uid}" when="open" items="messages" type="MailThreadNode[]"></sn-resource>
<sn-resource name="threadEvents" src="/api/email/thread-events?account_id={open.account_id}&mailbox={open.mailbox}&uid={open.uid}" when="open" type="MessageEventGroupJson[]"></sn-resource>
<sn-resource name="allowedOrigins" src="/api/email/image-origins" type="ImageOrigins"></sn-resource>
<sn-resource name="ignoredOrigins" src="/api/email/image-blacklist" type="ImageOrigins"></sn-resource>
<!-- The thread of a message an event came from (event detail → threads), when it is not the open one. -->
<sn-resource name="otherThread" src="/api/email/thread?account_id={threadRef.account_id}&mailbox={threadRef.mailbox}&uid={threadRef.uid}" when="threadRef && !threadRef.current" items="messages" type="MailThreadNode[]"></sn-resource>
<sn-resource name="otherThreadEvents" src="/api/email/thread-events?account_id={threadRef.account_id}&mailbox={threadRef.mailbox}&uid={threadRef.uid}" when="threadRef && !threadRef.current" type="MessageEventGroupJson[]"></sn-resource>
<!-- Calendars for importing a calendar attachment (partials/import-dialog.html). -->
<sn-resource name="caldavAccounts" src="/api/caldav/accounts" items="accounts" key="account_id" type="CalDavAccountJson[]"></sn-resource>
