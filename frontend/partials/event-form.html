<!-- New/edit event dialog #event-form with the recurrence builder (was EventFormDialog.svelte + RecurrenceBuilder.svelte).
     Include it once per page, outside any <template>. The page provides:
       - state `eventDraft` (EventDraft|null, src/lib/events.ts), opened with
           eventDraft = newEventDraft(calendars, date, defaultCal); showModal('event-form')
         or, from partials/event-detail.html's `event-edit` event,
           eventDraft = editEventDraft($event.detail.event, $event.detail.scope); showModal('event-form');
       - state `defaultCal` (string): the calendar of the last new event; persist it (data-sn-persist).
     It declares the `calendars` (CalendarJson[]) and `caldavAccounts` resources: the page reads them, never redeclares them.
     It emits `event-saved` and `event-deleted` from inside the dialog after the server accepted the change. -->
<sn-resource name="calendars" src="/api/calendars" key="account_id,href" type="CalendarJson[]"></sn-resource>
<sn-resource name="caldavAccounts" src="/api/caldav/accounts" items="accounts" key="account_id" type="CalDavAccountJson[]"></sn-resource>
<!-- attendee suggestions: loaded when the form first opens -->
<sn-resource name="attendeeContacts" src="/api/contacts" items="contacts" key="account_id,uid,addressbook_href" type="ContactJson[]" when="eventDraft"></sn-resource>

<dialog id="event-form" closedby="any"
        data-sn-state="{ eventError: '', summaryHints: false, attendeeRow: -1, attendeeQuery: '' }"
        data-sn-on-toggle="$el.open && $el.querySelector('input')?.select()"
        data-sn-on-close="eventError = ''; summaryHints = false; attendeeRow = -1">
  <header>
    <h2 data-sn-text="eventDraft?.mode === 'edit' ? m.event_edit() : m.event_create()"></h2>
    <button type="button" commandfor="event-form" command="close" data-sn-attr="{'aria-label': m.weekly_aria_close()}"></button>
  </header>

  <template data-sn-if="eventError">
    <div data-callout data-tone="danger" role="alert" data-sn-text="eventError"></div>
  </template>

  <template data-sn-if="eventDraft">
    <form data-layout="stack" data-gap="md"
          data-sn-post="/api/event" data-sn-encoding="form" data-sn-body="eventFormBody(eventDraft)"
          data-sn-then="defaultCal = eventDraft.mode === 'create' ? eventDraft.cal : defaultCal; close(); emit('event-saved', eventDraft)"
          data-sn-catch="eventError = $error.detail ?? m.event_error()">
      <label>
        <span data-sn-text="m.event_summary()"></span>
        <div data-combo data-sn-let="{ hints: summaryHints ? summarySuggestions(eventDraft.summary, $locale, $now) : [] }">
          <input type="text" required autofocus data-sn-model="eventDraft.summary" data-sn-listbox="event-summary-suggestions"
                 data-sn-attr="{'aria-expanded': hints.length > 0 ? 'true' : 'false'}"
                 data-sn-on-input="summaryHints = true"
                 data-sn-on-dismiss="summaryHints = false"
                 data-sn-on-blur="summaryHints = false">
          <div data-menu role="listbox" id="event-summary-suggestions" data-sn-show="hints.length > 0">
            <template data-sn-for="(s, i) in hints" data-sn-key="i">
              <div role="option" tabindex="-1" data-sn-text="s.label"
                   data-sn-on-click="eventDraft = applySummarySuggestion(eventDraft, s); summaryHints = false"></div>
            </template>
          </div>
        </div>
      </label>

      <div data-layout="row" data-gap="md" data-align="end">
        <label data-grow>
          <span data-sn-text="m.event_date()"></span>
          <input type="date" required data-sn-model="eventDraft.date">
        </label>
        <label data-layout="row" data-gap="sm" data-wrap="none">
          <input type="checkbox" role="switch" data-sn-model="eventDraft.is_all_day">
          <span data-sn-text="m.event_allDay()"></span>
        </label>
      </div>
      <template data-sn-if="!eventDraft.is_all_day">
        <div data-layout="grid" data-gap="sm" style="--tm-min: 9rem">
          <label>
            <span data-sn-text="m.event_startTime()"></span>
            <input type="time" data-sn-model="eventDraft.start_time"
                   data-sn-on-change="!eventDraft.end_time && $el.value && (eventDraft.end_time = halfHourAfter($el.value))">
          </label>
          <label>
            <span data-sn-text="m.event_endTime()"></span>
            <input type="time" data-sn-model="eventDraft.end_time">
          </label>
        </div>
      </template>

      <label>
        <span data-sn-text="m.event_location()"></span>
        <input type="text" data-sn-model="eventDraft.location">
      </label>

      <label>
        <span data-sn-text="m.event_description()"></span>
        <textarea rows="3" data-sn-model="eventDraft.description"></textarea>
      </label>

      <fieldset data-layout="stack" data-gap="sm">
        <legend data-sn-text="m.event_reminder()"></legend>
        <template data-sn-for="(alarm, i) in eventDraft.alarms">
          <div data-layout="row" data-gap="sm">
            <template data-sn-if="alarm.direction !== 'absolute'">
              <input type="number" min="1" class="event-num" data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="eventDraft.alarms[i].value">
              <select class="event-unit" data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="eventDraft.alarms[i].unit">
                <option value="1" data-sn-text="m.event_reminderMin()"></option>
                <option value="60" data-sn-text="m.event_reminderHours()"></option>
                <option value="1440" data-sn-text="m.event_reminderDays()"></option>
              </select>
            </template>
            <template data-sn-else>
              <input type="datetime-local" data-grow data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="eventDraft.alarms[i].datetime">
            </template>
            <select data-grow data-sn-attr="{'aria-label': m.event_reminder()}" data-sn-model="eventDraft.alarms[i].direction">
              <option value="before-start" data-sn-text="m.event_reminderBeforeStart()"></option>
              <option value="before-end" data-sn-text="m.event_reminderBeforeEnd()"></option>
              <option value="after-start" data-sn-text="m.event_reminderAfterStart()"></option>
              <option value="after-end" data-sn-text="m.event_reminderAfterEnd()"></option>
              <option value="absolute" data-sn-text="m.event_reminderAtTime()"></option>
            </select>
            <button type="button" data-variant="ghost" data-icon="x" data-sn-attr="{'aria-label': m.event_reminderRemove()}"
                    data-sn-on-click="eventDraft.alarms.splice(i, 1)"></button>
          </div>
        </template>
        <button type="button" data-variant="secondary" data-size="sm" data-icon="plus" data-self="start"
                data-sn-on-click="eventDraft.alarms.push(newAlarm())" data-sn-text="m.event_reminderAdd()"></button>
      </fieldset>

      <fieldset data-layout="stack" data-gap="sm">
        <legend data-sn-text="m.event_attendees()"></legend>
        <template data-sn-for="(att, i) in eventDraft.attendees">
          <div data-layout="row" data-gap="sm" style="--tm-grow-basis: 6rem"
               data-sn-let="{ hits: attendeeRow === i ? attendeeSuggestions(attendeeContacts, attendeeQuery) : [] }">
            <div data-combo data-grow>
              <input type="text" data-sn-listbox data-sn-model="eventDraft.attendees[i].cn"
                     data-sn-attr="{placeholder: m.event_attendeeName(), 'aria-label': m.event_attendeeName(), 'aria-expanded': hits.length > 0 ? 'true' : 'false'}"
                     data-sn-on-input="attendeeRow = i; attendeeQuery = $el.value"
                     data-sn-on-dismiss="attendeeRow = -1" data-sn-on-blur="attendeeRow = -1">
              <div data-menu role="listbox" data-sn-show="hits.length > 0">
                <template data-sn-for="(s, j) in hits" data-sn-key="j">
                  <div role="option" tabindex="-1" data-sn-text="attendeeLabel(s)"
                       data-sn-on-click="eventDraft.attendees[i].cn = s.cn; eventDraft.attendees[i].email = s.email; attendeeRow = -1"></div>
                </template>
              </div>
            </div>
            <div data-combo data-grow class="event-attendee-email">
              <input type="email" data-sn-listbox data-sn-model="eventDraft.attendees[i].email"
                     data-sn-attr="{placeholder: m.event_attendeeEmail(), 'aria-label': m.event_attendeeEmail(), 'aria-expanded': hits.length > 0 ? 'true' : 'false'}"
                     data-sn-on-input="attendeeRow = i; attendeeQuery = $el.value"
                     data-sn-on-dismiss="attendeeRow = -1" data-sn-on-blur="attendeeRow = -1">
              <div data-menu role="listbox" data-sn-show="hits.length > 0">
                <template data-sn-for="(s, j) in hits" data-sn-key="j">
                  <div role="option" tabindex="-1" data-sn-text="attendeeLabel(s)"
                       data-sn-on-click="eventDraft.attendees[i].cn = s.cn; eventDraft.attendees[i].email = s.email; attendeeRow = -1"></div>
                </template>
              </div>
            </div>
            <select class="event-partstat" data-sn-attr="{'aria-label': m.event_attendees()}" data-sn-model="eventDraft.attendees[i].partstat">
              <option value="NEEDS-ACTION" data-sn-text="m.event_attendeeStatusNeedsAction()"></option>
              <option value="ACCEPTED" data-sn-text="m.event_attendeeStatusAccepted()"></option>
              <option value="DECLINED" data-sn-text="m.event_attendeeStatusDeclined()"></option>
              <option value="TENTATIVE" data-sn-text="m.event_attendeeStatusTentative()"></option>
            </select>
            <button type="button" data-variant="ghost" data-icon="x" data-sn-attr="{'aria-label': m.event_attendeeRemove()}"
                    data-sn-on-click="eventDraft.attendees.splice(i, 1); attendeeRow = -1"></button>
          </div>
        </template>
        <button type="button" data-variant="secondary" data-size="sm" data-icon="plus" data-self="start"
                data-sn-on-click="eventDraft.attendees.push(newAttendee())" data-sn-text="m.event_attendeeAdd()"></button>
      </fieldset>

      <!-- Recurrence (was RecurrenceBuilder.svelte) -->
      <template data-sn-if="eventDraft.scope !== 'this_instance'">
        <label>
          <span data-sn-text="m.event_repeat()"></span>
          <select data-sn-model="eventDraft.rec.freq">
            <option value="" data-sn-text="m.event_repeatNone()"></option>
            <option value="DAILY" data-sn-text="m.event_repeatDaily()"></option>
            <option value="WEEKLY" data-sn-text="m.event_repeatWeekly()"></option>
            <option value="MONTHLY" data-sn-text="m.event_repeatMonthly()"></option>
            <option value="YEARLY" data-sn-text="m.event_repeatYearly()"></option>
          </select>
        </label>
      </template>
      <template data-sn-else>
        <small data-muted data-sn-text="m.event_repeatInstanceNote()"></small>
      </template>

      <template data-sn-if="eventDraft.rec.freq">
        <div data-layout="stack" data-gap="md">
          <fieldset>
            <legend data-sn-text="m.event_repeatEvery()"></legend>
            <div data-layout="row" data-gap="sm" data-wrap="none">
              <input type="number" min="1" class="event-num" data-sn-attr="{'aria-label': m.event_repeatEvery()}" data-sn-model="eventDraft.rec.interval">
              <span data-sn-text="intervalUnit(eventDraft.rec.freq)"></span>
            </div>
          </fieldset>

          <template data-sn-if="eventDraft.rec.freq === 'WEEKLY'">
            <fieldset>
              <legend data-sn-text="m.event_repeatOn()"></legend>
              <div data-layout="row" data-gap="xs">
                <template data-sn-for="d in weekdays()" data-sn-key="d.code">
                  <button type="button" data-variant="outline" data-size="sm"
                          data-sn-attr="{'aria-pressed': eventDraft.rec.by_day.includes(d.code) ? 'true' : 'false'}"
                          data-sn-on-click="eventDraft.rec.by_day = eventDraft.rec.by_day.includes(d.code) ? eventDraft.rec.by_day.filter(c => c !== d.code) : [...eventDraft.rec.by_day, d.code]"
                          data-sn-text="d.label"></button>
                </template>
              </div>
            </fieldset>
          </template>

          <template data-sn-if="eventDraft.rec.freq === 'MONTHLY'">
            <fieldset>
              <legend data-sn-text="m.event_repeatOn()"></legend>
              <div data-layout="row" data-gap="sm">
                <label><input type="radio" name="monthly_mode" value="by_day" data-sn-model="eventDraft.rec.monthly_mode"> <span data-sn-text="m.event_monthlyByDay()"></span></label>
                <input type="number" min="1" max="31" class="event-num" data-sn-model="eventDraft.rec.monthday"
                       data-sn-attr="{'aria-label': m.event_monthlyByDay(), disabled: eventDraft.rec.monthly_mode !== 'by_day'}">
              </div>
              <div data-layout="row" data-gap="sm">
                <label><input type="radio" name="monthly_mode" value="by_setpos" data-sn-model="eventDraft.rec.monthly_mode"> <span data-sn-text="m.event_monthlyByPos()"></span></label>
                <select data-sn-model="eventDraft.rec.setpos"
                        data-sn-attr="{'aria-label': m.event_monthlyByPos(), disabled: eventDraft.rec.monthly_mode !== 'by_setpos'}">
                  <option value="1" data-sn-text="m.event_monthlyPos1()"></option>
                  <option value="2" data-sn-text="m.event_monthlyPos2()"></option>
                  <option value="3" data-sn-text="m.event_monthlyPos3()"></option>
                  <option value="4" data-sn-text="m.event_monthlyPos4()"></option>
                  <option value="-1" data-sn-text="m.event_monthlyPosLast()"></option>
                </select>
                <select data-sn-model="eventDraft.rec.setpos_day"
                        data-sn-attr="{'aria-label': m.event_repeatOn(), disabled: eventDraft.rec.monthly_mode !== 'by_setpos'}">
                  <template data-sn-for="d in weekdays()" data-sn-key="d.code">
                    <option data-sn-attr="{value: d.code}" data-sn-text="d.label"></option>
                  </template>
                </select>
              </div>
            </fieldset>
          </template>

          <fieldset>
            <legend data-sn-text="m.event_repeatEnd()"></legend>
            <label><input type="radio" name="rrule_end_type" value="never" data-sn-model="eventDraft.rec.end_type"> <span data-sn-text="m.event_repeatEndNever()"></span></label>
            <div data-layout="row" data-gap="sm">
              <label><input type="radio" name="rrule_end_type" value="count" data-sn-model="eventDraft.rec.end_type"> <span data-sn-text="m.event_repeatEndAfter()"></span></label>
              <input type="number" min="1" class="event-num" data-sn-model="eventDraft.rec.count"
                     data-sn-attr="{'aria-label': m.event_repeatEndAfterN(), disabled: eventDraft.rec.end_type !== 'count'}">
              <span data-sn-text="m.event_repeatEndAfterN()"></span>
            </div>
            <div data-layout="row" data-gap="sm">
              <label><input type="radio" name="rrule_end_type" value="until" data-sn-model="eventDraft.rec.end_type"> <span data-sn-text="m.event_repeatEndOn()"></span></label>
              <input type="date" data-grow data-sn-model="eventDraft.rec.until"
                     data-sn-attr="{'aria-label': m.event_repeatEndOn(), disabled: eventDraft.rec.end_type !== 'until'}">
            </div>
          </fieldset>
        </div>
      </template>

      <label>
        <span data-sn-text="m.event_calendar()"></span>
        <select data-sn-model="eventDraft.cal" data-sn-attr="{disabled: eventDraft.scope === 'this_instance'}"
                data-sn-on-change="defaultCal = $el.value">
          <template data-sn-for="g in calendarGroups(calendars, caldavAccounts)" data-sn-key="g.account_id">
            <optgroup data-sn-attr="{label: g.label}">
              <template data-sn-for="cal in g.calendars">
                <option data-sn-attr="{value: calendarKey(cal)}" data-sn-text="cal.name"></option>
              </template>
            </optgroup>
          </template>
        </select>
      </label>

      <footer data-layout="row" data-gap="sm">
        <template data-sn-if="eventDraft.mode === 'edit'">
          <button type="button" data-variant="ghost" data-tone="danger" data-icon="trash-2"
                  data-sn-delete="/api/event?account_id={eventDraft.cal.split('\0')[0]}&uid={eventDraft.uid}&calendar_href={eventDraft.cal.split('\0')[1]}&scope={eventDraft.scope === 'this_instance' && eventDraft.original_dtstart ? 'this_instance' : null}&original_dtstart={eventDraft.scope === 'this_instance' && eventDraft.original_dtstart ? eventDraft.original_dtstart : null}&tz={eventDraft.scope === 'this_instance' && eventDraft.original_dtstart ? eventDraft.original_tz : null}"
                  data-sn-confirm="m.event_deleteConfirm()"
                  data-sn-then="close('event-form'); emit('event-deleted', eventDraft)"
                  data-sn-catch="eventError = $error.detail ?? m.event_error()"
                  data-sn-text="m.event_delete()"></button>
          <span data-grow></span>
        </template>
        <button type="button" data-variant="ghost" commandfor="event-form" command="close" data-sn-text="m.event_cancel()"></button>
        <button type="submit" data-sn-text="m.event_save()"></button>
      </footer>
    </form>
  </template>
</dialog>
