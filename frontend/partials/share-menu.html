<!-- Share button and its menu (download, send by mail) for one file. Include it where `shareItem` is in scope:
     a ShareItem from the helpers `contactShare(c)` or `eventShare(ev)` (src/lib/share.ts), e.g.
       <div data-sn-let="{ shareItem: contactShare(c) }"><sn-include src="../partials/share-menu.html"></sn-include></div>
     On touch screens with the Web Share API the button opens the system share sheet instead of the menu.
     Once per page, and not inside a <template> (it declares the `shareNative` resource and the popover #share-menu):
     where the item can be missing, make `shareItem` null then. Actions: src/actions/share.ts. -->
<sn-resource name="shareNative" call="share.native()"></sn-resource>
<template data-sn-if="shareNative">
  <button type="button" data-icon="share-2" data-variant="ghost" data-sn-attr="{'aria-label': m.share_share()}"
          data-sn-call="share.send(shareItem)" data-sn-concurrency="block"></button>
</template>
<template data-sn-else>
  <button type="button" data-icon="share-2" data-variant="ghost" popovertarget="share-menu"
          data-sn-attr="{'aria-label': m.share_share()}"></button>
</template>
<div popover id="share-menu" data-menu>
  <button type="button" data-icon="download" popovertarget="share-menu" popovertargetaction="hide"
          data-sn-call="share.download(shareItem)" data-sn-concurrency="block"
          data-sn-text="shareItem?.type === 'text/calendar' ? m.share_downloadIcs() : m.share_downloadVCard()"></button>
  <button type="button" data-icon="mail" popovertarget="share-menu" popovertargetaction="hide"
          data-sn-call="share.email(shareItem)" data-sn-concurrency="block" data-sn-text="m.share_email()"></button>
</div>
