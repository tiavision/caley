<!doctype html>
<!-- Mail: folders (accounts, mailboxes, virtual folders), the message list and the reader (<email-reader>).
     The URL holds what is shown (src/lib/mail.ts "The mail page's URL"): the view (?account_id=&mailbox= or
     ?folder=), the message open (uid; below 1024px it is the reader's overlay, so Back closes it), the list's page
     and the search. The page reads its parameters by name ($url.uid), never $url whole, so its own links and
     navigate() stay in the page.
     Page state: wiped: the key of the encrypted message whose decrypted content was dropped while the page was
     hidden (it is not loaded again until asked); detail, threadRef: what <event-detail> and <thread-dialog> show;
     needContacts: load the contacts (the search's sender filter).
     The dialogs with drafts (compose, image sources, import, account, folder) are components around the page's
     content: their openers emit the draft. -->
<app-layout data-sn-with="{ here: '/mail/', title: mailTitle(unread) }"
            data-sn-state="{
              wiped: '',
              detail: /** @type {EventJson|null} */ (null),
              threadRef: /** @type {ThreadRef|null} */ (null),
              needContacts: false,
            }"
            data-sn-on-keydown-j="pageKey($event) && elementIn($el, '.mail-page')?.dispatchEvent(listStep(1))"
            data-sn-on-keydown-k="pageKey($event) && elementIn($el, '.mail-page')?.dispatchEvent(listStep(-1))">
  <sn-resource name="unread" src="/email/unread-counts" cache></sn-resource>
  <sn-resource name="identities" src="/email/identities" cache></sn-resource>
  <sn-resource name="contacts" src="/contacts" select="contacts" key="account_id,uid,addressbook_href" when="needContacts"></sn-resource>
  <email-reader-data data-sn-with="{ open: urlRef($url.account_id, $url.mailbox, $url.uid), threadRef, wiped }"></email-reader-data>
  <!-- sinter-mail's warm-up: parses a sample mail while the page waits for the message, so the parser is compiled
       before the real body arrives. -->
  <mail-warm></mail-warm>

  <!-- cur: the list shown, the URL's view, else `view`, the one remembered from the last visit (persisted). The
       lists' `then` check it once they have arrived (currentView(): it while it exists, else the first inbox) and
       put a view the URL does not name into it, in place (replace: no history entry). The message list's URL reads
       only the URL and `view`, so the early file requests it before the page script. collapsed: account ids.
       The lists are declared here, in cur's scope, for those `then`s; their names are page-wide. -->
  <main data-layout="stack" data-gap="none"
        data-sn-state="{ view: noView(), collapsed: /** @type {string[]} */ ([]) }"
        data-sn-persist="mail"
        data-sn-let="{
          cur: shownView(urlView($url.folder, $url.account_id, $url.mailbox), view),
          open: urlRef($url.account_id, $url.mailbox, $url.uid),
        }">
    <sn-resource name="accounts" src="/email/accounts" cache
                 then="view = currentView(cur, accounts, mailboxes, folders, { accounts: true, folders: !!$meta.folders.loadedAt });
                       urlLags(view, urlView($url.folder, $url.account_id, $url.mailbox)) && navigate(viewHref(view), { replace: true })"></sn-resource>
    <sn-resource name="mailboxes" for="a in accounts" src="/email/mailboxes?account_id={a.account_id}"
                 then="view = currentView(cur, accounts, mailboxes, folders, { accounts: !!$meta.accounts.loadedAt, folders: !!$meta.folders.loadedAt });
                       urlLags(view, urlView($url.folder, $url.account_id, $url.mailbox)) && navigate(viewHref(view), { replace: true })"></sn-resource>
    <sn-resource name="folders" src="/email/folders" cache order="sort_order"
                 then="view = currentView(cur, accounts, mailboxes, folders, { accounts: !!$meta.accounts.loadedAt, folders: true });
                       urlLags(view, urlView($url.folder, $url.account_id, $url.mailbox)) && navigate(viewHref(view), { replace: true })"></sn-resource>
    <!-- An account that signed in at its mail server comes back with ?account_error= when that failed. The URL keeps
         only the view, so the text is kept in state: its own, not <main>'s, which is remembered (data-sn-persist) and
         would bring back an old value over the URL's. -->
    <div class="account-error-slot" data-sn-state="{ accountError: $url.account_error ?? '' }">
      <template data-sn-if="accountError">
        <div class="account-error" data-callout data-tone="danger" role="alert" data-layout="row" data-gap="sm" data-wrap="none">
          <span data-grow data-sn-text="m.mail_accountError({error: accountError})"></span>
          <button type="button" data-variant="ghost" data-size="sm" data-icon="x" data-tooltip
                  data-sn-on-click="accountError = ''" data-sn-attr="{'aria-label': m.mail_close()}"></button>
        </div>
      </template>
    </div>
    <!-- defaultCal: the calendar the import dialog preselects and remembers (shared with the calendar pages' event form). -->
    <div class="mail-contents" data-sn-state="{ defaultCal: '' }" data-sn-persist="event-default-calendar"
         data-sn-on-ics-imported="$event.detail.errors === 0 && (defaultCal = $event.detail.calendar)">
  <email-compose data-sn-with="{ pending: true }">
  <email-origins>
  <import-dialog>
  <email-account>
  <email-folder>
    <!-- List state: sel (Selection: the cursor, the rows marked for a bulk action, the bulk menu), searchBox (the
         sender filter's box; search, MailSearch, is the URL's query and filters with it), drag (the message dragged
         to a mailbox, the mailbox under it).
         Events of the list (emitted inside it, handled here):
           mail-open {detail: Message}: show it in the reader (its ref into the URL), with the cursor on it;
           mail-view: the list shows another view (viewHref() has no message, page or search): no marks;
           list-step {detail: 1 | -1}: j/k, open the next/previous message (or load that page at the end of one);
           reader-back (Escape, the reader's back button): the overlay closes, the cursor goes to its message;
           view-removed: the virtual folder or account shown was removed: no view, no marks;
                        mail-removed (the reader moved or deleted its message), thread-open, decrypt: see src/components/email-reader.html.
         Changes to messages (flags, moves, deletions) reach the lists through the server's events. -->
    <!-- Keys without a control of their own: j/k (the layout's tag: on <body>, so they work wherever the focus is,
         dispatched here as list-step; not while rows are marked), Escape and the scroll keys on the reader, the marking and
         arrow keys on the rows (key filters; the others are data-shortcut on their buttons). -->
    <div class="mail-page" data-layout="stack" data-gap="none" data-density="compact" data-grow
         data-sn-state="{
           syncing: /** @type {string[]} */ ([]),
           sidebarOpen: false,
           searchBox: noSearchBox(),
           sel: noSelection(),
           drag: noDrag(),
           pageValue: /** @type {number|null} */ (1),
           trash: { account_id: '', mailbox: '', choice: '30', custom: /** @type {number|null} */ (30), error: '', busy: false },
           hit: /** @type {Message|null} */ (null),
         }"
         data-sn-let="{
           search: mailSearch(searchBox, $url.q, $url.sender, $url.after, $url.before, !!$url.unread),
           searching: searchActive(search),
           list: searching ? results : messages,
           listPending: searching ? $meta.results.loading
             : $meta.messages.loading
               || (!accounts.length && !$meta.accounts.loadedAt && !$meta.accounts.error),
           bulk: bulkOf(list, sel.keys, mailboxes),
           addressBook: contactAddresses(contacts ?? []),
           ownThread: !threadRef || threadRef.current,
           threadNodes: ownThread ? (thread ?? []) : (otherThread ?? []),
           threadEventGroups: ownThread ? (threadEvents ?? []) : (otherThreadEvents ?? []),
           threadLoading: ownThread ? $meta.thread.loading || $meta.threadEvents.loading : $meta.otherThread.loading || $meta.otherThreadEvents.loading,
           threadLinks: false,
           eventThreads: true,
         }"
         
         data-sn-on-mail-removed="$url.uid = null; sel = unmarked(sel)"
         data-sn-on-mail-open="$url.account_id = $event.detail.account_id; $url.mailbox = $event.detail.mailbox; $url.uid = $event.detail.uid;
                               sel = openedAt(sel, messageKey($event.detail))"
         data-sn-on-thread-open="threadRef = $event.detail; openDialog('thread-dialog')"
         data-sn-on-decrypt="wiped = ''"
         data-sn-on-view-removed="view = currentView(noView(), accounts, mailboxes, folders); sel = unmarked(sel);
                                  navigate(viewHref(view), { replace: true })"
         data-sn-on-mail-view="sel = cleared(sel, null); searchBox = noSearchBox()"
         data-sn-on-list-step="hit = bulk.messages.length ? null : neighbor(list, open ? messageKey(open) : sel.cursor, $event.detail);
                               hit && emit('mail-open', hit);
                               hit && elementIn($el, '.message-detail')?.focus();
                               !hit && !bulk.messages.length && page(list, $event.detail > 0 ? 'next' : 'prev')"
         data-sn-on-reader-back="sel.cursor = open ? messageKey(open) : sel.cursor; $url.uid = null"
         data-sn-on-sn-navigate="sel.selecting && $event.kind === 'traverse' && $event.preventDefault();
                              sel = sel.selecting && $event.kind === 'traverse' ? cleared(sel) : sel">
      <sn-resource name="messages"
                   src="/email/messages?account_id={cur.account_id}&mailbox={cur.mailbox}&folder_id={cur.folder_id}"
                   when="(cur.mailbox || cur.folder_id) && !searching" cache
                   paginate="{ numbered: 'offset', size: 50, model: $url.page }"></sn-resource>
      <sn-resource name="results"
                   src="/email/search?q={search.q.trim()}&account_id={cur.account_id}&mailbox={cur.mailbox}&folder_id={cur.folder_id}&addrs={$url.sender.length ? $url.sender.join(',') : null}&date_from={search.filter.from || null}&date_to={search.filter.to || null}&unread_only={search.filter.unread ? 'true' : null}"
                   when="searching"
                   paginate="{ keyset: { cursor_sent_at: $item.sent_at, cursor_rowid: $item.rowid }, size: 50, more: 'has_more' }"></sn-resource>
      <sn-resource name="seenAddrs" src="/email/suggest-addrs?q={search.addrQ}" when="search.addrQ.trim()"></sn-resource>

      <!-- The page's server events (shares the rail's connection). -->
      <sn-sync src="/events/stream">
        <sn-event name="emails_refetch" resource="messages" op="refresh" type="MailboxEvent"
                  when="!cur.folder_id && $event.account_id === cur.account_id && $event.mailbox === cur.mailbox"></sn-event>
        <sn-event name="emails_refetch" resource="unread" op="refresh"></sn-event>
        <sn-event name="email_updated" resource="messages" op="merge" type="EmailUpdatedEvent"
                  value="{flags: $event.flags, is_read: $event.flags.includes('\\Seen'), is_flagged: $event.flags.includes('\\Flagged')}"></sn-event>
        <sn-event name="email_updated" resource="results" op="merge" type="EmailUpdatedEvent"
                  value="{flags: $event.flags, is_read: $event.flags.includes('\\Seen'), is_flagged: $event.flags.includes('\\Flagged')}"></sn-event>
        <sn-event name="email_updated" resource="message" op="merge" type="EmailUpdatedEvent"
                  when="isRef(open, $event)"
                  value="{flags: $event.flags, is_read: $event.flags.includes('\\Seen'), is_flagged: $event.flags.includes('\\Flagged')}"></sn-event>
        <sn-event name="email_updated" resource="unread" op="refresh"></sn-event>
        <sn-event name="email_removed" resource="messages" op="remove" type="EmailRemovedEvent"></sn-event>
        <sn-event name="email_removed" resource="results" op="remove" type="EmailRemovedEvent"></sn-event>
        <sn-event name="email_removed" resource="message" op="remove" type="EmailRemovedEvent" when="isRef(open, $event)"
                  then="$url.uid = null"></sn-event>
        <sn-event name="email_removed" resource="unread" op="refresh"></sn-event>
        <sn-event name="accounts_changed" resource="accounts" op="refresh"></sn-event>
        <sn-event name="accounts_changed" resource="mailboxes" op="refresh"></sn-event>
        <sn-event name="calendars_changed" resource="caldavAccounts" op="refresh"></sn-event>
        <sn-event name="mailboxes_changed" resource="mailboxes" op="refresh" type="AccountEvent"></sn-event>
        <sn-event name="sync_started" type="MailboxEvent" then="syncing = [...syncing, mailboxKey($event.account_id, $event.mailbox)]"></sn-event>
        <sn-event name="sync_completed" resource="unread" op="refresh" type="MailboxEvent"
                  then="syncing = syncing.filter(k => k !== mailboxKey($event.account_id, $event.mailbox))"></sn-event>
      </sn-sync>
      <!-- New-mail notifications: the rail shows none on this page, the page shows them itself. -->
      <template data-sn-if="$meta.unread.loadedAt"><email-notifier></email-notifier></template>
      <!-- Hidden or left: an encrypted message's body is dropped (wiped), and what was decrypted with it (#wipe). -->
      <span hidden id="wipe" data-sn-call="mail.wipe()"></span>
      <email-hidden-watch data-sn-on-page-hidden="body && body.encrypted && run('wipe'); wiped = body && body.encrypted ? body.key : wiped"></email-hidden-watch>

      <!-- sidebarW, listW: the widths of the folder and message columns, set with the two <email-split>s (persisted). -->
      <div class="mail-layout" data-grow data-sn-state="{ sidebarW: 220, listW: 320 }" data-sn-persist="mail-widths"
           data-sn-style="{'--sidebar-w': sidebarW + 'px', '--list-w': listW + 'px'}">
        <!-- ── Folders ───────────────────────────────────────────────────────── -->
        <button type="button" class="sidebar-backdrop" data-sn-show="sidebarOpen" data-sn-on-click="sidebarOpen = false"
                data-sn-attr="{'aria-label': m.mail_aria_folders()}"></button>
        <!-- menuAcc: the account whose "…" button opened #account-menu (one menu for every account). -->
        <aside class="mail-sidebar" data-layout="stack" data-gap="md" data-pad="sm" data-scroll="y"
               data-sn-state="{ menuAcc: /** @type {Account|null} */ (null) }"
               data-sn-class="{open: sidebarOpen}" data-sn-attr="{'aria-label': m.mail_aria_folders()}">
          <template data-sn-if="folders.length > 0">
            <div data-layout="stack" data-gap="none">
              <div class="section-header" data-layout="row" data-gap="xs" data-wrap="none">
                <span data-caption data-truncate data-grow data-sn-text="m.mail_virtualFolders()"></span>
              </div>
              <template data-sn-for="f in folders">
                <div data-layout="row" data-gap="none" data-wrap="none" data-sn-let="{ n: unread?.folders?.[f.folder_id] ?? 0 }">
                  <button type="button" class="sidebar-item" data-variant="item" data-size="sm" data-layout="row" data-gap="sm" data-wrap="none" data-grow
                          data-sn-attr="{'aria-current': cur.folder_id === f.folder_id ? 'true' : null}"
                          data-sn-on-click="navigate(viewHref(folderView(f.folder_id))); sidebarOpen = false; emit('mail-view')">
                    <span data-icon="layers" aria-hidden="true"></span>
                    <span data-truncate data-grow data-sn-text="f.display_name"></span>
                    <template data-sn-if="n > 0"><span data-badge data-tone="accent" data-sn-text="badgeCount(n)"></span></template>
                  </button>
                  <button type="button" data-variant="ghost" data-size="sm" data-icon="pencil" data-tooltip
                          data-sn-on-click="sidebarOpen = false; emit('folder-edit', folderDraft(f))"
                          data-sn-attr="{'aria-label': m.mail_editVirtualFolder()}"></button>
                  <button type="button" data-variant="ghost" data-size="sm" data-icon="x" data-tooltip
                          data-sn-delete="/email/folder?folder_id={f.folder_id}"
                          data-sn-optimistic="remove(f)"
                          data-sn-then="sidebarOpen = false; cur.folder_id === f.folder_id && (sel = unmarked(sel)); view = currentView(cur, accounts, mailboxes, folders);
                                        urlLags(view, urlView($url.folder, $url.account_id, $url.mailbox)) && navigate(viewHref(view), { replace: true })"
                          data-sn-attr="{'aria-label': m.mail_removeAttachment()}"></button>
                </div>
              </template>
            </div>
          </template>

          <template data-sn-if="!accounts.length && !$meta.accounts.loadedAt && !$meta.accounts.error">
            <div class="sidebar-placeholder" data-layout="stack" data-gap="none" aria-busy="true" data-sn-attr="{'aria-label': m.mail_loading()}">
              <template data-sn-for="w in [40, 70, 55, 62, 48]" data-sn-key="w"><span class="placeholder-bar" data-sn-style="{'--w': w + '%'}"></span></template>
            </div>
          </template>
          <template data-sn-for="section in sidebarSections(accounts, mailboxes, unread, collapsed)" data-sn-key="section.account.account_id">
            <div data-layout="stack" data-gap="none" data-sn-let="{ acc: section.account }">
              <div class="section-header" data-layout="row" data-gap="none" data-wrap="none">
                <button type="button" class="account-collapse-btn" data-variant="ghost" data-size="sm" data-icon="chevron-down"
                        data-sn-class="{collapsed: section.collapsed}"
                        data-sn-attr="{'aria-label': section.collapsed ? m.mail_expandAccount() : m.mail_collapseAccount(), 'aria-expanded': section.collapsed ? 'false' : 'true'}"
                        data-sn-on-click="collapsed = toggled(collapsed, acc.account_id)"></button>
                <span data-caption data-truncate data-grow data-sn-attr="{title: acc.username}" data-sn-text="acc.display_name"></span>
                <template data-sn-if="section.unread > 0"><span data-badge data-tone="accent" data-sn-text="badgeCount(section.unread)"></span></template>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="ellipsis" data-tooltip popovertarget="account-menu"
                        data-sn-on-click="menuAcc = acc"
                        data-sn-attr="{'aria-label': m.mail_accountActions({name: acc.display_name})}"></button>
              </div>
              <template data-sn-if="!section.collapsed && !section.mailboxes.length && ($meta.mailboxes.loading || (!$meta.mailboxes.loadedAt && !$meta.mailboxes.error))">
                <div class="sidebar-placeholder" data-layout="stack" data-gap="none" aria-busy="true" data-sn-attr="{'aria-label': m.mail_loading()}">
                  <template data-sn-for="w in [45, 60, 50, 68]" data-sn-key="w"><span class="placeholder-bar" data-sn-style="{'--w': w + '%'}"></span></template>
                </div>
              </template>
              <template data-sn-for="item in section.mailboxes" data-sn-key="item.key">
                <div class="sidebar-drop" data-layout="stack" data-gap="none"
                     data-sn-let="{ mb: item.mailbox, canDrop: canDrop(drag.msg, item.mailbox) }"
                     data-sn-on-dragover="canDrop && $event.preventDefault(); drag.over = canDrop ? item.key : drag.over"
                     data-sn-on-dragleave="drag.over === item.key && (drag.over = null)"
                     data-sn-on-drop="isRef(open, drag.msg) && ($url.uid = null)"
                     data-sn-post="/email/message/move" data-sn-trigger="drop"
                     data-sn-when="drag.msg" data-sn-body="moveBody(drag.msg, mb.name)"
                     data-sn-optimistic="remove(drag.msg)"
                     data-sn-then="refresh(messages, results, unread)">
                  <button type="button" class="sidebar-item" data-variant="item" data-size="sm" data-layout="row" data-gap="sm" data-wrap="none"
                          data-sn-let="{ busy: syncing.includes(item.key), kind: folderKind(mb.name) }"
                          data-sn-class="{'drag-target': canDrop, 'drag-over': drag.over === item.key}"
                          data-sn-attr="{'aria-busy': busy ? 'true' : null, 'aria-current': cur.account_id === mb.account_id && cur.mailbox === mb.name ? 'true' : null}"
                          data-sn-post="/email/sync?account_id={mb.account_id}&mailbox={mb.name}" data-sn-catch="sel.error = sel.error"
                          data-sn-on-click="navigate(viewHref(mailboxView(mb.account_id, mb.name))); sidebarOpen = false; emit('mail-view')">
                    <email-folder-icon data-sn-with="{ kind }"></email-folder-icon>
                    <span data-truncate data-grow data-sn-text="folderName(mb.name)"></span>
                    <template data-sn-if="!busy && item.unread > 0"><span data-badge data-tone="accent" data-sn-text="badgeCount(item.unread)"></span></template>
                  </button>
                </div>
              </template>
            </div>
          </template>

          <!-- The actions of the account in menuAcc, under the "…" button that opened it. -->
          <div popover id="account-menu" data-menu role="menu">
            <template data-sn-if="menuAcc">
              <button type="button" role="menuitem" data-icon="user"
                      data-sn-on-click="ancestor($el, '[popover]')?.hidePopover(); sidebarOpen = false; emit('identities-open', menuAcc.account_id)"
                      data-sn-text="m.mail_identities()"></button>
              <button type="button" role="menuitem" data-icon="pencil"
                      data-sn-on-click="ancestor($el, '[popover]')?.hidePopover(); sidebarOpen = false; emit('account-edit', {acct: editAccount(menuAcc, identities), ui: accountUi('details')})"
                      data-sn-text="m.mail_editAccountHeading()"></button>
              <hr>
              <button type="button" role="menuitem" data-icon="trash-2" data-tone="danger"
                      data-sn-let="{ acc: menuAcc }"
                      data-sn-on-click="ancestor($el, '[popover]')?.hidePopover()"
                      data-sn-delete="/email/account?account_id={acc.account_id}"
                      data-sn-confirm="m.mail_removeAccountConfirm({name: acc.display_name})"
                      data-sn-then="sidebarOpen = false; refresh(accounts); collapsed = collapsed.filter(id => id !== acc.account_id); cur.account_id === acc.account_id && emit('view-removed')"
                      data-sn-text="m.mail_removeAccount()"></button>
            </template>
          </div>

          <div class="sidebar-add" data-layout="stack" data-gap="none">
            <button type="button" data-variant="ghost" data-size="sm" data-icon="plus"
                    data-sn-on-click="sidebarOpen = false; emit('account-edit', {acct: newAccount(), ui: accountUi('basic')})"
                    data-sn-text="m.mail_addAccount()"></button>
            <button type="button" data-variant="ghost" data-size="sm" data-icon="plus"
                    data-sn-on-click="sidebarOpen = false; emit('folder-edit', folderDraft(null))"
                    data-sn-text="m.mail_addVirtualFolder()"></button>
          </div>
        </aside>
        <email-split class="resize-handle" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="140" aria-valuemax="400"
                    data-sn-with="{ width: sidebarW }"
                    data-sn-attr="{'aria-label': m.mail_resizeFolders(), 'aria-valuenow': sidebarW}"
                    data-sn-on-split-resize="sidebarW = clampWidth('sidebar', $event.detail)"
                    data-sn-on-keydown="sidebarW = keyWidth('sidebar', $event, sidebarW); ($event.key === 'ArrowLeft' || $event.key === 'ArrowRight') && $event.preventDefault()"></email-split>

        <!-- ── Message list ───────────────────────────────────────────────────── -->
        <section class="message-list" data-layout="stack" data-gap="none" data-sn-attr="{'aria-label': m.nav_mail()}">
          <div class="message-list-header" data-layout="stack" data-gap="sm" data-pad="sm">
            <div data-layout="row" data-gap="xs" data-wrap="none">
              <nav-toggle></nav-toggle>
              <button type="button" class="folder-toggle" data-variant="ghost" data-icon="folder" data-sn-on-click="sidebarOpen = true"
                      data-sn-attr="{'aria-label': m.mail_aria_folders()}"></button>
              <h2 data-truncate data-grow data-sn-text="viewTitle(cur, folders)"></h2>
              <template data-sn-if="cur.folder_id || cur.mailbox">
                <div data-layout="row" data-gap="xs" data-wrap="none">
                  <template data-sn-if="!sel.selecting && list.length > 0">
                    <button type="button" class="overlay-only" data-variant="ghost" data-icon="list-checks" data-sn-on-click="sel = selecting(sel)"
                            data-sn-attr="{'aria-label': m.mail_select()}"></button>
                  </template>
                  <template data-sn-if="cur.account_id && cur.mailbox && !cur.folder_id && folderKind(cur.mailbox) === 'trash'">
                    <button type="button" data-variant="ghost" data-tone="danger" data-icon="trash-2" data-tooltip commandfor="mail-empty-trash" command="show-modal"
                            data-sn-on-click="trash = {account_id: cur.account_id, mailbox: cur.mailbox, choice: '30', custom: 30, error: '', busy: false}"
                            data-sn-attr="{'aria-label': m.mail_emptyTrash()}"></button>
                  </template>
                  <button type="button" data-variant="ghost" data-icon="user" data-tooltip popovertarget="mail-filter-addr"
                          data-sn-on-click="needContacts = true"
                          data-sn-attr="{'aria-label': m.mail_filterBySender(), 'aria-pressed': search.filter.addrs.length > 0 ? 'true' : 'false'}"></button>
                  <div popover id="mail-filter-addr" class="filter-popover" data-menu role="dialog"
                       data-sn-attr="{'aria-label': m.mail_filterBySender()}"
                       data-sn-let="{ hits: senderHits(search.addrInput, addressBook, seenAddrs ?? [], search.filter.addrs) }">
                    <input type="search" data-sn-model="searchBox.addrInput" data-sn-on-input="searchBox.addrQ = searchBox.addrInput" data-sn-debounce-input="300"
                           data-sn-attr="{placeholder: m.mail_filterAddrPlaceholder(), 'aria-label': m.mail_filterAddrPlaceholder()}">
                    <template data-sn-if="search.filter.addrs.length > 0">
                      <div data-layout="row" data-gap="xs" data-pad="xs">
                        <template data-sn-for="addr in search.filter.addrs" data-sn-key="addr">
                          <span class="filter-chip" data-badge data-tone="accent" data-sn-attr="{title: addr}">
                            <span data-truncate data-sn-text="senderLabel(addr, addressBook)"></span>
                            <button type="button" class="chip-remove" data-variant="ghost" data-icon="x"
                                    data-sn-attr="{'aria-label': m.mail_removeAttachment()}"
                                    data-sn-on-click="$url.sender = toggled($url.sender, addr); sel = unmarked(sel); $url.uid = null"></button>
                          </span>
                        </template>
                      </div>
                      <button type="button" data-icon="trash-2" data-sn-on-click="$url.sender = []; sel = unmarked(sel); $url.uid = null" data-sn-text="m.mail_filterClearAddrs()"></button>
                      <hr>
                    </template>
                    <template data-sn-for="s in hits.contacts" data-sn-key="s.email">
                      <label class="filter-suggestion-row">
                        <input type="checkbox" value="" data-sn-model="$url.sender" data-sn-attr="{value: s.email}"
                               data-sn-on-change="sel = unmarked(sel); $url.uid = null">
                        <span data-layout="stack" data-gap="none" data-grow>
                          <template data-sn-if="s.name"><span data-truncate data-sn-text="s.name"></span></template>
                          <small data-muted class="suggestion-email" data-sn-text="s.email"></small>
                        </span>
                      </label>
                    </template>
                    <template data-sn-for="addr in hits.seen" data-sn-key="addr">
                      <label class="filter-suggestion-row">
                        <input type="checkbox" value="" data-sn-model="$url.sender" data-sn-attr="{value: addr}"
                               data-sn-on-change="sel = unmarked(sel); $url.uid = null">
                        <small class="suggestion-email" data-grow data-sn-text="addr"></small>
                      </label>
                    </template>
                    <template data-sn-if="hits.canAdd">
                      <button type="button" data-tone="accent" data-icon="plus"
                              data-sn-on-click="sel = addableSender(search) ? unmarked(sel) : sel;
                                                addableSender(search) && ($url.uid = null);
                                                $url.sender = senderAdded(search).filter.addrs;
                                                searchBox = noSearchBox()">
                        <span data-truncate data-sn-text="`${m.mail_filterAddAddr()}: ${search.addrInput}`"></span>
                      </button>
                    </template>
                  </div>
                  <button type="button" data-variant="ghost" data-icon="calendar" data-tooltip popovertarget="mail-filter-date"
                          data-sn-attr="{'aria-label': m.mail_filterByDate(), 'aria-pressed': search.filter.from || search.filter.to ? 'true' : 'false'}"></button>
                  <div popover id="mail-filter-date" class="filter-popover filter-popover-date" data-menu role="dialog"
                       data-sn-attr="{'aria-label': m.mail_filterByDate()}">
                    <div data-layout="stack" data-gap="sm" data-pad="xs">
                      <label>
                        <span data-sn-text="m.mail_filterDateFrom()"></span>
                        <input type="date" data-sn-model="$url.after" data-sn-on-change="sel = unmarked(sel); $url.uid = null">
                      </label>
                      <label>
                        <span data-sn-text="m.mail_filterDateTo()"></span>
                        <input type="date" data-sn-model="$url.before" data-sn-on-change="sel = unmarked(sel); $url.uid = null">
                      </label>
                      <template data-sn-if="search.filter.from || search.filter.to">
                        <button type="button" data-variant="secondary" data-size="sm" data-self="start"
                                data-sn-on-click="$url.after = null; $url.before = null; sel = unmarked(sel); $url.uid = null" data-sn-text="m.mail_filterClearDate()"></button>
                      </template>
                    </div>
                  </div>
                  <button type="button" data-variant="ghost" data-icon="circle-check" data-tooltip
                          data-sn-on-click="$url.unread = !search.filter.unread; sel = unmarked(sel); $url.uid = null"
                          data-sn-attr="{'aria-label': m.mail_filterUnread(), 'aria-pressed': search.filter.unread ? 'true' : 'false'}"></button>
                </div>
              </template>
            </div>
            <!-- Selection mode (the Select button): what is marked, Select all, Cancel. -->
            <template data-sn-if="sel.selecting">
              <div class="selection-row" data-layout="row" data-gap="xs" data-wrap="none">
                <button type="button" data-variant="ghost" data-icon="x" data-shortcut="escape" data-sn-on-click="sel = cleared(sel)"
                        data-sn-attr="{disabled: sel.busy, 'aria-label': m.mail_cancel()}"></button>
                <strong data-grow data-truncate role="status"
                        data-sn-text="bulk.messages.length ? m.mail_selectedCount({n: bulk.messages.length}) : m.mail_selectPrompt()"></strong>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="check-check" data-sn-on-click="sel = allMarked(sel, list)"
                        data-sn-attr="{disabled: sel.busy || bulk.messages.length === list.length}" data-sn-text="m.mail_selectAll()"></button>
              </div>
            </template>
            <template data-sn-if="cur.folder_id || cur.mailbox">
              <!-- a model on $url.q: written at each typing pause, the first of a run a history entry -->
              <div data-field>
                <span data-icon="search" aria-hidden="true"></span>
                <input type="search" data-sn-model="$url.q"
                       data-sn-on-input="sel = unmarked(sel); $url.uid = null"
                       data-sn-attr="{placeholder: m.mail_searchPlaceholder(), 'aria-label': m.mail_searchPlaceholder()}">
              </div>
            </template>
            <template data-sn-if="searching && !$meta.results.loading">
              <small data-muted data-sn-text="results.length === 1 ? m.mail_result1() : m.mail_resultsN({n: results.length})"></small>
            </template>
            <template data-sn-if="listPending && list.length > 0">
              <progress class="list-progress" data-sn-attr="{'aria-label': m.mail_loading()}"></progress>
            </template>
          </div>

          <div class="message-list-scroll" data-layout="stack" data-gap="none" data-scroll="y" data-grow
               data-sn-attr="{'aria-busy': listPending && list.length > 0 && (searching || !!$meta.messages.loadedAt) ? 'true' : null}">
            <template data-sn-if="listPending && !list.length">
              <div class="list-placeholder" data-layout="stack" data-gap="none" aria-busy="true" data-sn-attr="{'aria-label': m.mail_loading()}">
                <template data-sn-for="w in [62, 48, 70, 55, 66, 42, 58, 50]" data-sn-key="w">
                  <div class="placeholder-row" data-layout="stack" data-gap="xs" data-pad="sm">
                    <span class="placeholder-bar" data-sn-style="{'--w': (w - 20) + '%'}"></span>
                    <span class="placeholder-bar" data-sn-style="{'--w': w + '%'}"></span>
                  </div>
                </template>
              </div>
            </template>
            <template data-sn-else>
              <template data-sn-if="!list.length">
                <p class="list-status" data-muted
                   data-sn-text="listStatus(searching, search.q, accounts.length, cur)"></p>
              </template>
            </template>
            <template data-sn-for="msg in list">
              <button type="button" class="message-row" data-variant="item" data-layout="stack" data-gap="none" data-align="stretch" data-bar draggable="true"
                      data-sn-let="{ k: messageKey(msg) }"
                      data-sn-class="{unread: !msg.is_read, cursor: k === sel.cursor}"
                      data-sn-attr="{
                        'aria-pressed': sel.keys.includes(k) ? 'true' : 'false',
                        'aria-current': !bulk.messages.length && isRef(open, msg) ? 'true' : null,
                        tabindex: k === sel.cursor || (!sel.cursor && list[0] === msg) ? '0' : '-1',
                      }"
                      data-sn-on-focusin="sel.cursor = k"
                      data-sn-on-click="sel = rowClick($event, sel, k, list, open); opensRow($event, sel) && emit('mail-open', msg)"
                      data-sn-on-keydown-mod-space="sel = rowClick($event, sel, k, list, open)"
                      data-sn-on-keydown-shift-space="sel = rowClick($event, sel, k, list, open)"
                      data-sn-on-keydown-arrowdown="siblingRow($el, 1)?.focus(); !siblingRow($el, 1) && page(list, 'next')"
                      data-sn-on-keydown-arrowup="siblingRow($el, -1)?.focus(); !siblingRow($el, -1) && page(list, 'prev')"
                      data-sn-on-dragstart="drag.msg = msg"
                      data-sn-on-dragend="drag = noDrag()">
                <span data-layout="row" data-gap="sm" data-wrap="none">
                  <template data-sn-if="sel.selecting">
                    <template data-sn-if="sel.keys.includes(k)"><span class="row-check" data-icon="square-check" aria-hidden="true"></span></template>
                    <template data-sn-else><span class="row-check" data-icon="square" data-muted aria-hidden="true"></span></template>
                  </template>
                  <span class="from" data-truncate data-grow><template data-sn-if="!msg.is_read"><span class="unread-dot" aria-label="Unread"></span></template><span data-sn-text="senderName(msg.from) || m.mail_unknownSender()"></span></span>
                  <small class="date" data-muted data-sn-text="formatDate(msg.sent_at)"></small>
                </span>
                <span data-layout="row" data-gap="xs" data-wrap="none">
                  <span class="subject" data-truncate data-grow data-sn-text="msg.subject || m.mail_noSubject()"></span>
                  <template data-sn-if="msg.is_flagged"><span class="flag-star" data-icon="star" role="img" data-sn-attr="{'aria-label': m.mail_flaggedTitle(), title: m.mail_flaggedTitle()}"></span></template>
                  <template data-sn-if="msg.has_attachments && !msg.is_encrypted"><span data-icon="paperclip" data-muted role="img" data-sn-attr="{'aria-label': m.mail_hasAttachments(), title: m.mail_hasAttachments()}"></span></template>
                </span>
              </button>
            </template>
          </div>

          <!-- Selection mode: the actions for the marked rows (More: the whole bulk menu, in the overlay). -->
          <template data-sn-if="sel.selecting">
            <div class="selection-bar" data-layout="stack" data-gap="xs" data-pad="xs" data-sn-attr="{'aria-busy': sel.busy ? 'true' : 'false'}">
              <template data-sn-if="sel.error && !sel.more"><p data-callout data-tone="danger" role="alert" data-sn-text="sel.error"></p></template>
              <div data-layout="row" data-gap="xs" data-justify="between" data-wrap="none" role="toolbar"
                   data-sn-attr="{'aria-label': m.mail_selectedCount({n: bulk.messages.length})}">
                <button type="button" data-variant="ghost" data-icon="archive" data-sn-on-click="sel.busy = true"
                        data-sn-attr="{disabled: sel.busy || !bulk.canArchive, 'aria-label': m.mail_archive()}"
                        data-sn-post="/email/messages/move" data-sn-body="bulkMoveBody(bulk.messages, null, mailboxes)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"></button>
                <button type="button" data-variant="ghost" data-icon="trash-2" data-tone="danger" data-sn-on-click="sel.busy = true"
                        data-sn-attr="{disabled: sel.busy || !bulk.messages.length, 'aria-label': m.mail_delete()}"
                        data-sn-confirm="bulk.inTrash ? m.mail_bulkDeleteConfirm() : null"
                        data-sn-post="/email/messages/delete" data-sn-body="bulkBody(bulk.messages)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"></button>
                <button type="button" data-variant="ghost" data-icon="mail-open" data-sn-on-click="sel.busy = true"
                        data-sn-attr="{disabled: sel.busy || !bulk.messages.length, 'aria-label': m.mail_markRead()}"
                        data-sn-patch="/email/messages/flags" data-sn-body="bulkFlagsBody(bulk.messages, '\\Seen', true)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"></button>
                <button type="button" data-variant="ghost" data-icon="ellipsis" data-sn-on-click="sel.more = true"
                        data-sn-attr="{disabled: sel.busy || !bulk.messages.length, 'aria-label': m.mail_more()}"></button>
              </div>
            </div>
          </template>
          <template data-sn-if="!sel.selecting && (searching ? results.length > 0 : ($meta.messages.total ?? 0) > 0)">
            <nav class="pagination-bar" data-layout="row" data-gap="xs" data-justify="center" data-wrap="none" data-pad="xs">
              <template data-sn-if="searching">
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevrons-left" data-tooltip data-sn-on-click="page(results, 'first'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.results.hasPrev, 'aria-label': m.mail_firstPageAria()}"></button>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevron-left" data-tooltip data-sn-on-click="page(results, 'prev'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.results.hasPrev, 'aria-label': m.mail_prevPageAria()}"></button>
                <!-- no total for a search (counting every match is as slow as the search): the range, which sinter tracks from the page moves -->
                <small data-muted data-sn-text="m.mail_pageRange({start: $meta.results.from ?? 0, end: $meta.results.to ?? 0})"></small>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevron-right" data-tooltip data-sn-on-click="page(results, 'next'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.results.hasNext, 'aria-label': m.mail_nextPageAria()}"></button>
              </template>
              <template data-sn-else>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevrons-left" data-tooltip data-sn-on-click="page(messages, 'first'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.messages.hasPrev, 'aria-label': m.mail_firstPageAria()}"></button>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevron-left" data-tooltip data-sn-on-click="page(messages, 'prev'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.messages.hasPrev, 'aria-label': m.mail_prevPageAria()}"></button>
                <button type="button" class="page-status" data-variant="ghost" data-size="sm" popovertarget="mail-page-jump"
                        data-sn-on-click="pageValue = $meta.messages.page ?? null"
                        data-sn-attr="{title: m.mail_jumpToPageAria()}"
                        data-sn-text="m.mail_pageStatus({start: $meta.messages.from ?? 0, end: $meta.messages.to ?? 0, total: $meta.messages.total ?? 0})"></button>
                <form popover id="mail-page-jump" class="page-jump" data-layout="row" data-gap="xs" data-wrap="none" data-pad="xs"
                      data-sn-on-submit="$event.preventDefault(); pageValue && page(messages, pageValue); sel = pageValue ? unmarked(sel) : sel; $el.hidePopover()">
                  <input class="page-input" data-size="sm" type="number" min="1" autofocus data-sn-model="pageValue"
                         data-sn-attr="{max: $meta.messages.pages, 'aria-label': m.mail_jumpToPageAria()}">
                  <small data-muted data-sn-text="`/ ${$meta.messages.pages}`"></small>
                </form>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevron-right" data-tooltip data-sn-on-click="page(messages, 'next'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.messages.hasNext, 'aria-label': m.mail_nextPageAria()}"></button>
                <button type="button" data-variant="ghost" data-size="sm" data-icon="chevrons-right" data-tooltip data-sn-on-click="page(messages, 'last'); sel = unmarked(sel)"
                        data-sn-attr="{disabled: !$meta.messages.hasNext, 'aria-label': m.mail_lastPageAria()}"></button>
              </template>
            </nav>
          </template>
        </section>
        <email-split class="resize-handle detail-resize-handle" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="600"
                    data-sn-with="{ width: listW }"
                    data-sn-attr="{'aria-label': m.mail_resizeMessages(), 'aria-valuenow': listW}"
                    data-sn-on-split-resize="listW = clampWidth('list', $event.detail)"
                    data-sn-on-keydown="listW = keyWidth('list', $event, listW); ($event.key === 'ArrowLeft' || $event.key === 'ArrowRight') && $event.preventDefault()"></email-split>

        <!-- ── Reader, or the bulk menu for marked rows ─────────────────────────── -->
        <!-- Escape: clears the marks (the bulk menu shows here) or closes the overlay. -->
        <section class="message-detail" data-layout="stack" data-gap="none" tabindex="-1"
                 data-sn-on-keydown-escape="bulk.messages.length > 0 && (sel = bulkBack(sel)); bulk.messages.length === 0 && emit('reader-back')"
                 data-sn-on-keydown-pageup="!bulk.messages.length && emit('reader-scroll', $event)"
                 data-sn-on-keydown-pagedown="!bulk.messages.length && emit('reader-scroll', $event)"
                 data-sn-on-keydown-home="!bulk.messages.length && emit('reader-scroll', $event)"
                 data-sn-on-keydown-end="!bulk.messages.length && emit('reader-scroll', $event)"
                 data-sn-on-reader-scroll="readerScroller($el)?.scrollTo({top: scrollTopFor($event.detail.key, readerScroller($el))})"
                 data-sn-class="{'is-open': bulk.messages.length > 0 && (!sel.selecting || sel.more) || !!open}"
                 data-sn-attr="{'aria-label': m.nav_mail()}">
          <template data-sn-if="bulk.messages.length > 0">
            <div class="detail-header" data-layout="row" data-gap="sm" data-wrap="none" data-pad="sm">
              <button type="button" class="overlay-only" data-variant="ghost" data-icon="arrow-left" data-sn-on-click="sel = bulkBack(sel)"
                      data-sn-attr="{'aria-label': m.mail_back()}"></button>
              <h2 class="detail-subject" data-grow data-sn-text="m.mail_selectedCount({n: bulk.messages.length})"></h2>
              <button type="button" data-variant="outline" data-size="sm" data-shortcut="escape" data-sn-on-click="sel = cleared(sel)"
                      data-sn-attr="{disabled: sel.busy}" data-sn-text="m.mail_clearSelection()"></button>
            </div>
            <div data-layout="stack" data-gap="md" data-pad="md" data-scroll="y" data-sn-attr="{'aria-busy': sel.busy ? 'true' : 'false'}">
              <template data-sn-if="sel.error"><p data-callout data-tone="danger" role="alert" data-sn-text="sel.error"></p></template>
              <div class="bulk-menu" data-menu data-self="start">
                <button type="button" data-icon="mail-open" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                        data-sn-patch="/email/messages/flags" data-sn-body="bulkFlagsBody(bulk.messages, '\\Seen', true)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                        data-sn-text="m.mail_markRead()"></button>
                <button type="button" data-icon="mail" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                        data-sn-patch="/email/messages/flags" data-sn-body="bulkFlagsBody(bulk.messages, '\\Seen', false)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                        data-sn-text="m.mail_markUnread()"></button>
                <button type="button" data-icon="star" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                        data-sn-patch="/email/messages/flags" data-sn-body="bulkFlagsBody(bulk.messages, '\\Flagged', true)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                        data-sn-text="m.mail_flag()"></button>
                <button type="button" data-icon="star-off" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                        data-sn-patch="/email/messages/flags" data-sn-body="bulkFlagsBody(bulk.messages, '\\Flagged', false)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                        data-sn-text="m.mail_unflag()"></button>
                <hr>
                <template data-sn-if="bulk.canArchive">
                  <button type="button" data-icon="archive" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                          data-sn-post="/email/messages/move" data-sn-body="bulkMoveBody(bulk.messages, null, mailboxes)"
                          data-sn-then="sel = afterBulk(sel, $result.failed)"
                          data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                          data-sn-text="m.mail_archive()"></button>
                </template>
                <template data-sn-if="bulk.targets.length > 0">
                  <button type="button" data-icon="folder-input" data-sn-attr="{disabled: sel.busy, 'aria-expanded': sel.move ? 'true' : 'false'}" data-sn-on-click="sel.move = !sel.move">
                    <span data-grow data-sn-text="m.mail_moveToFolder()"></span>
                    <span class="caret" data-icon="chevron-down" aria-hidden="true"></span>
                  </button>
                </template>
                <template data-sn-if="bulk.canArchive || bulk.targets.length > 0"><hr></template>
                <button type="button" data-icon="trash-2" data-tone="danger" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                        data-sn-confirm="bulk.inTrash ? m.mail_bulkDeleteConfirm() : null"
                        data-sn-post="/email/messages/delete" data-sn-body="bulkBody(bulk.messages)"
                        data-sn-then="sel = afterBulk(sel, $result.failed)"
                        data-sn-catch="sel = afterBulk(sel, bulk.messages)"
                        data-sn-text="m.mail_delete()"></button>
              </div>
              <template data-sn-if="sel.move && bulk.targets.length > 0">
                <div class="bulk-menu" data-menu data-self="start" role="group" data-sn-attr="{'aria-label': m.mail_moveToFolder()}">
                  <template data-sn-for="mb in bulk.targets">
                    <button type="button" data-sn-let="{ kind: folderKind(mb.name) }" data-sn-attr="{disabled: sel.busy}" data-sn-on-click="sel.busy = true"
                            data-sn-post="/email/messages/move" data-sn-body="bulkMoveBody(bulk.messages, mb.name, mailboxes)"
                            data-sn-then="sel = afterBulk(sel, $result.failed)"
                            data-sn-catch="sel = afterBulk(sel, bulk.messages)">
                      <email-folder-icon data-sn-with="{ kind }"></email-folder-icon>
                      <span data-truncate data-sn-text="folderName(mb.name)"></span>
                    </button>
                  </template>
                </div>
              </template>
            </div>
          </template>
          <!-- Not in the early script (data-sn-early="off"): what the reader shows needs message and body, `call`
               resources that only the page bundle loads, so before it nothing of it would render. -->
          <template data-sn-else>
            <email-reader data-sn-with="{ open, defaultCal }" data-sn-early="off">
              <button slot="back" type="button" class="detail-close-btn overlay-only" data-variant="ghost" data-icon="arrow-left"
                      data-sn-on-click="emit('reader-back')" data-sn-attr="{'aria-label': m.mail_back()}"></button>
              <button slot="popout" type="button" data-variant="ghost" data-icon="external-link" data-tooltip data-sn-call="mail.popout(open)"
                      data-sn-attr="{'aria-label': m.mail_popout()}"></button>
            </email-reader>
          </template>
        </section>
      </div>

      <!-- ── Empty trash ───────────────────────────────────────────────────────── -->
      <dialog id="mail-empty-trash" closedby="any" data-sn-on-cancel="trash.busy && $event.preventDefault()"
              data-sn-let="{ days: emptyTrashDays(trash.choice, trash.custom) }">
        <form data-sn-post="/email/trash/empty"
              data-sn-body="{account_id: trash.account_id, mailbox: trash.mailbox, days}"
              data-sn-on-submit="trash.busy = true; trash.error = ''"
              data-sn-then="inMailbox(open, trash) && ($url.uid = null); sel = unmarked(sel); refresh(messages, results, unread); closeDialog()"
              data-sn-catch="trash.busy = false; trash.error = $error.body?.error === 'savedate_unsupported' ? m.mail_emptyTrashUnsupported() : m.mail_emptyTrashError()">
          <header>
            <h2 data-sn-text="m.mail_emptyTrash()"></h2>
            <button type="button" commandfor="mail-empty-trash" command="close" data-sn-attr="{'aria-label': m.mail_close(), disabled: trash.busy}"></button>
          </header>
          <p data-muted data-sn-text="m.mail_emptyTrashPrompt()"></p>
          <div data-list role="radiogroup" data-sn-attr="{'aria-label': m.mail_emptyTrashOlderThan()}">
            <label><input type="radio" name="trash-days" value="7" data-sn-model="trash.choice" data-sn-attr="{disabled: trash.busy}"> <span data-sn-text="m.mail_emptyTrash7()"></span></label>
            <label><input type="radio" name="trash-days" value="30" data-sn-model="trash.choice" data-sn-attr="{disabled: trash.busy}"> <span data-sn-text="m.mail_emptyTrash30()"></span></label>
            <label><input type="radio" name="trash-days" value="90" data-sn-model="trash.choice" data-sn-attr="{disabled: trash.busy}"> <span data-sn-text="m.mail_emptyTrash90()"></span></label>
            <label data-layout="row" data-gap="sm" data-wrap="none">
              <input type="radio" name="trash-days" value="custom" data-sn-model="trash.choice" data-sn-attr="{disabled: trash.busy}">
              <span data-grow data-sn-text="m.mail_emptyTrashCustom()"></span>
              <input class="trash-days" type="number" data-size="sm" min="1" max="3650" step="1" data-sn-model="trash.custom"
                     data-sn-attr="{disabled: trash.busy || trash.choice !== 'custom', 'aria-label': m.mail_emptyTrashCustomDays()}">
            </label>
          </div>
          <template data-sn-if="trash.choice === 'custom' && !validTrashDays(days)">
            <p data-tone="danger" role="alert" data-sn-text="m.mail_emptyTrashInvalidDays()"></p>
          </template>
          <template data-sn-else>
            <template data-sn-if="trash.error"><p data-tone="danger" role="alert" data-sn-text="trash.error"></p></template>
          </template>
          <footer>
            <button type="button" data-variant="ghost" commandfor="mail-empty-trash" command="close" data-sn-attr="{disabled: trash.busy}" data-sn-text="m.mail_cancel()"></button>
            <button type="submit" data-tone="danger" data-icon="trash-2" data-sn-attr="{disabled: trash.busy || !validTrashDays(days)}"
                    data-sn-text="trash.busy ? m.mail_emptyTrashDeleting() : m.mail_emptyTrashConfirm()"></button>
          </footer>
        </form>
      </dialog>

      <thread-dialog data-sn-with="{ nodes: threadNodes, eventGroups: threadEventGroups, loading: threadLoading, current: threadRef, links: threadLinks }"
                     data-sn-on-thread-message="$url.account_id = $event.detail.account_id; $url.mailbox = $event.detail.mailbox; $url.uid = $event.detail.uid;
                                                sel = unmarked(sel)"
                     data-sn-on-event-open="detail = $event.detail; openDialog('event-detail')"></thread-dialog>
      <event-detail data-sn-with="{ event: detail, threads: eventThreads }"
                    data-sn-on-event-threads="threadRef = threadOfEmail($event.detail.email, $event.detail.event); openDialog('thread-dialog')"></event-detail>

      <!-- Next to the FAB: the image sources dialog for every message. Not in selection mode: its bar is where they float. -->
      <template data-sn-if="!sel.selecting">
        <button type="button" class="origins-trigger" data-variant="secondary" data-icon="image" data-tooltip
                data-sn-on-click="emit('origins-open', null)"
                data-sn-attr="{'aria-label': m.mail_manageImageSources()}"
                data-sn-text="(allowedOrigins?.origins.length ?? 0) + (ignoredOrigins?.origins.length ?? 0) || ''"></button>
        <button type="button" data-fab data-icon="plus"
                data-sn-on-click="emit('compose', composeDraft('new', null, identities))"
                data-sn-attr="{'aria-label': m.mail_newMessage()}"></button>
      </template>
    </div>
  </email-folder>
  </email-account>
  </import-dialog>
  </email-origins>
  </email-compose>
  </div>
  </main>
  <script type="module" src="/src/main/mail.ts"></script>
</app-layout>
