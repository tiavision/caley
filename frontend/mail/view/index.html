<!doctype html>
<html lang="en">
  <head>
    <app-head data-sn-prop="{ title: 'Caley - Mail' }"></app-head>
  </head>
  <!-- One message in its own window (?account_id=&mailbox=&uid=, from the reader's pop-out button and new-mail
       notifications): the reader of /mail/ (<mail-reader>) without the list. -->
  <body data-shell="fixed"
        data-sn-state="{
          reader: { ref: urlRef($url), shown: false },
          wiped: '',
          detail: /** @type {EventJson|null} */ (null),
          threadRef: /** @type {ThreadRef|null} */ (null),
        }"
        data-sn-let="{ open: reader.ref }">
    <sn-resource name="user" src="/api/user" type="User"></sn-resource>
    <sn-resource name="mailboxes" src="/api/email/mailboxes?account_id={open.account_id}" when="open" items="mailboxes" key="account_id,name" type="Mailbox[]"></sn-resource>
    <sn-resource name="identities" src="/api/email/identities" items="identities" key="identity_id" type="Identity[]"></sn-resource>
    <mail-reader-data data-sn-prop="{ open, threadRef, wiped }"></mail-reader-data>
    <sn-sync src="/api/events/stream">
      <sn-event name="emails_refetch" resource="message" op="refetch" type="MailboxEvent"
                when="open && account_id === open.account_id && mailbox === open.mailbox"></sn-event>
      <sn-event name="emails_refetch" resource="body" op="refetch" type="MailboxEvent"
                when="open && account_id === open.account_id && mailbox === open.mailbox"></sn-event>
      <sn-event name="email_updated" resource="message" op="patch" type="EmailUpdatedEvent"
                when="isRef(open, {account_id, mailbox, uid})"
                set="{flags, is_read: flags.includes('\\Seen'), is_flagged: flags.includes('\\Flagged')}"></sn-event>
      <sn-event name="email_removed" resource="message" op="remove" type="EmailRemovedEvent" when="isRef(open, {account_id, mailbox, uid})"
                then="reader = noReader()"></sn-event>
      <sn-event name="mailboxes_changed" resource="mailboxes" op="refetch" type="AccountEvent" when="open && account_id === open.account_id"></sn-event>
      <sn-event name="accounts_changed" resource="mailboxes" op="refetch"></sn-event>
          <sn-event name="calendars_changed" resource="caldavAccounts" op="refetch"></sn-event>
    </sn-sync>
    <mail-hidden-watch data-sn-on-page-hidden="wiped = body && body.encrypted ? body.key : wiped"></mail-hidden-watch>
    <main data-layout="stack" data-gap="none"
          data-sn-let="{
             ownThread: !threadRef || threadRef.current,
             threadNodes: ownThread ? (thread ?? []) : (otherThread ?? []),
             threadEventGroups: ownThread ? (threadEvents ?? []) : (otherThreadEvents ?? []),
             threadLoading: ownThread ? $meta.thread.loading || $meta.threadEvents.loading : $meta.otherThread.loading || $meta.otherThreadEvents.loading,
             threadLinks: false,
             eventThreads: true,
           }"
          data-sn-on-mail-removed="reader = noReader()"
          data-sn-on-thread-open="threadRef = $event.detail; showModal('thread-dialog')"
          data-sn-on-decrypt="wiped = ''">
      <!-- defaultCal: the calendar the import dialog preselects and remembers (shared with the calendar pages' event form). -->
      <div class="mail-contents" data-sn-state="{ defaultCal: '' }" data-sn-persist="event-default-calendar"
           data-sn-on-ics-imported="$event.detail.errors === 0 && (defaultCal = $event.detail.calendar)">
      <mail-compose>
      <mail-origins>
      <import-dialog>
      <div class="mail-layout standalone" data-density="compact" data-grow>
        <section class="message-detail standalone" data-layout="stack" data-gap="none" tabindex="-1" autofocus
                 data-sn-attr="{'aria-label': m.nav_mail()}"
                 data-sn-on-keydown-pageup="$el.scrollTo({top: scrollTopFor($event.key, $el)})"
                 data-sn-on-keydown-pagedown="$el.scrollTo({top: scrollTopFor($event.key, $el)})"
                 data-sn-on-keydown-home="$el.scrollTo({top: scrollTopFor($event.key, $el)})"
                 data-sn-on-keydown-end="$el.scrollTo({top: scrollTopFor($event.key, $el)})">
          <mail-reader data-sn-prop="{ open, defaultCal }">
            <p slot="idle" class="detail-status" data-muted data-sn-text="m.mail_messageUnavailable()"></p>
          </mail-reader>
        </section>
      </div>
      <thread-dialog data-sn-prop="{ nodes: threadNodes, eventGroups: threadEventGroups, loading: threadLoading, current: threadRef, links: threadLinks }"
                     data-sn-on-thread-message="reader = readerOn($event.detail)"
                     data-sn-on-event-open="detail = $event.detail; showModal('event-detail')"></thread-dialog>
      <event-detail data-sn-prop="{ event: detail, threads: eventThreads }"
                    data-sn-on-event-threads="threadRef = threadOfEmail($event.detail.email, $event.detail.event); showModal('thread-dialog')"></event-detail>
      </import-dialog>
      </mail-origins>
      </mail-compose>
      </div>
    </main>
    <script type="module" src="/src/main/mail-view.ts"></script>
  </body>
</html>
