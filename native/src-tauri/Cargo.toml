[package]
name = "caley-native"
version = "2.0.0"
description = "Caley's app shell: picks a Caley server and opens it"
edition = "2024"

[lib]
# the mobile targets link the library (staticlib for iOS, cdylib for Android)
name = "caley_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
url = "2.5.9"
webpki-roots = "1.0.12"
