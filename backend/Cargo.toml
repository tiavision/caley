[package]
name = "caley"
version = "1.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
openidconnect = { version = "4", default-features = false }
base64 = "0.23"
chrono = "0.4.44"
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = { version = "0.15.7" }
futures-util = "0.3"
hkdf = "0.13"
ical = "0.11"
quick-xml = "0.42"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["webpki-tokio", "logging"] }
hyper-util = { version = "0.1.20", features = ["client", "tokio"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate", "time"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hmac = "0.13"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["auth", "fs"] }
tower-sessions = "0.15"
async-trait = "0.1"
rmp-serde = "1"
time = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
p256 = { version = "0.14", features = ["ecdh"] }
rust-stemmers = "1.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "1.0"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
infer = "0.22.0"
idna = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.14"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
openssl = { version = "0.10", features = ["vendored"] }
