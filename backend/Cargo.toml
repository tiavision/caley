[package]
name = "caley"
version = "0.9.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros", "multipart"] }
axum-oidc = "0.6.0"
base64 = "0.22"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.54", features = ["derive", "env"] }
dotenvy = { version = "0.15.7" }
futures-util = "0.3"
hkdf = "0.12"
ical = "0.11"
quick-xml = "0.37"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rrule = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["webpki-tokio", "logging"] }
hyper-util = { version = "0.1.19", features = ["client", "tokio"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hmac = "0.12"
tower = "0.5"
tower-http = { version = "0.6.8", features = ["auth", "fs"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
time = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
p256 = { version = "0.13", features = ["ecdh"] }
rust-stemmers = "1.2"
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
infer = "0.19.0"
tar = "0.4"
flate2 = "1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
openssl = { version = "0.10", features = ["vendored"] }
