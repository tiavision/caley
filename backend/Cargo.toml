[package]
name = "caley"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
askama = "0.16"
axum = { version = "0.8.8", features = ["macros"] }
axum-oidc = "0.6.0"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.54", features = ["derive", "env"] }
dotenvy = { version = "0.15.7" }
ical = "0.11"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rrule = "0.13"
serde = { version = "1", features = ["derive"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["webpki-tokio", "logging"] }
hyper-util = { version = "0.1.19", features = ["client", "tokio"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = "0.5"
tower-http = { version = "0.6.8", features = ["auth", "fs"] }
tower-sessions = "0.14"
url = "2"
