<div data-month="{{ month }}">
  <header>
    <hgroup>
      <h2>
        <span hx-get="/api/calendar?month={{ prev_month }}" hx-indicator="#calendar-grid" role="button" tabindex="0" data-i18n-attr="aria-label:cal.aria.prevMonth" aria-label="Previous month" style="cursor: pointer;"><span class="arrow">&#8249;</span></span>
        <span id="month-title" data-i18n-month="{{ month_number }}" data-i18n-year="{{ year }}">{{ month_name }} {{ year }}</span>
        <span hx-get="/api/calendar?month={{ next_month }}" hx-indicator="#calendar-grid" role="button" tabindex="0" data-i18n-attr="aria-label:cal.aria.nextMonth" aria-label="Next month" style="cursor: pointer;"><span class="arrow">&#8250;</span></span>
      </h2>
      <p data-i18n="cal.monthlyView">Monthly calendar view</p>
    </hgroup>
  </header>
  <div class="calendar-content" style="position: relative;">
    <div class="calendar-loading" data-i18n="cal.loadingCalendar">Loading calendar…</div>
    <div role="grid">
      <div class="date-grid" role="row">
        <small data-i18n-day-short="1">Mon</small><small data-i18n-day-short="2">Tue</small><small data-i18n-day-short="3">Wed</small>
        <small data-i18n-day-short="4">Thu</small><small data-i18n-day-short="5">Fri</small><small data-i18n-day-short="6">Sat</small><small data-i18n-day-short="7">Sun</small>
      </div>
      <div class="date-grid" id="date-grid" role="grid">
        {% for day in days %}
        <div class="date-cell{% if !day.is_current_month %} empty{% endif %}" data-date="{{ day.date_str }}">{% if day.is_current_month %}{{ day.day_number }}{% if !day.event_colors.is_empty() %}<div class="event-dots">{% for color in day.event_colors %}<span class="event-dot" style="background-color: {{ color }};"></span>{% endfor %}</div>{% endif %}{% endif %}</div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
