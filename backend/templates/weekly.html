<div class="week-loading" data-i18n="weekly.loading">Loading events</div>
{% for day in days %}
<div class="day{% if day.is_today %} today{% endif %}" role="row" data-raw-date-aria="{{ day.date_iso }}">
  <h5 aria-hidden="true" data-raw-date="{{ day.date_iso }}">{{ day.day_name }}</h5>
  <div class="appointments" role="presentation">
    {% for event in day.events %}
    <article class="appointment event-trigger" tabindex="-1" role="gridcell"
      data-uid="{{ event.uid }}"
      data-summary="{{ event.summary }}"
      data-dtstart="{{ event.dtstart }}"
      data-dtend="{{ event.dtend }}"
      data-tz="{{ event.tz }}"
      data-is-all-day="{{ event.is_all_day }}"
      data-location="{{ event.location }}"
      data-description="{{ event.description }}"
      data-is-recurring="{{ event.is_recurring }}"
      data-calendar-href="{{ event.calendar_href }}"
      data-master-dtstart="{{ event.master_dtstart }}"
      {% if !event.recurrence_json.is_empty() %}data-recurrence='{{ event.recurrence_json }}'{% endif %}
      {% if !event.alarm_directions.is_empty() %}data-alarm-directions="{{ event.alarm_directions }}" data-alarm-values="{{ event.alarm_values }}" data-alarm-units="{{ event.alarm_units }}" data-alarm-datetimes="{{ event.alarm_datetimes }}"{% endif %}
      {% if !event.color.is_empty() %}style="border-left: 3px solid {{ event.color }};"{% endif %}>
      <header>{{ event.time_range }}</header>
      <p>{{ event.summary }}</p>
    </article>
    {% endfor %}
  </div>
</div>
{% endfor %}
