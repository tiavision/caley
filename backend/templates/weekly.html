<div class="week-loading">Loading events</div>
{% for day in days %}
<div class="day{% if day.is_today %} today{% endif %}">
  <h5>{{ day.day_name }}</h5>
  <div class="appointments">
    {% for event in day.events %}
    <article class="appointment event-trigger" tabindex="0"
      data-uid="{{ event.uid }}"
      data-summary="{{ event.summary }}"
      data-dtstart="{{ event.dtstart }}"
      data-dtend="{{ event.dtend }}"
      data-tz="{{ event.tz }}"
      data-is-all-day="{{ event.is_all_day }}"
      data-location="{{ event.location }}"
      data-description="{{ event.description }}"
      data-is-recurring="{{ event.is_recurring }}"
      {% if !event.recurrence_json.is_empty() %}data-recurrence='{{ event.recurrence_json }}'{% endif %}>
      <header>{{ event.time_range }}{% if !event.color.is_empty() %} <span class="dot" style="background-color: {{ event.color }};"></span>{% endif %}</header>
      <p>{{ event.summary }}</p>
    </article>
    {% endfor %}
  </div>
</div>
{% endfor %}
