<ul class="calendar-list">
{% for cal in calendars %}
<li>
    <label>
        <input type="checkbox" name="cal" value="{{ cal.href }}|{% if let Some(color) = cal.color %}{{ color }}{% endif %}" {% if !deactivated.contains(cal.href.as_str()) %}checked{% endif %} />
        {{ cal.name }}
        {% if let Some(color) = cal.color %}
        <span class="dot" style="background-color: {{ color }};"></span>
        {% endif %}
    </label>
</li>
{% endfor %}
</ul>
