name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v, e.g. 1.4.2"
        type: string
        required: true
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: true
        default: false

env:
  REGISTRY: git.tia.sh
  IMAGE_NAME: ${{ github.event.repository.name }}
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  release:
    runs-on: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and tag
        run: |
          set -eu

          case "$VERSION" in
            v*)
              echo "Pass version without leading v, for example 1.4.2"
              exit 1
              ;;
          esac

          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Create tag
        run: |
          set -eu

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@${{ env.REGISTRY }}"

          git tag -a "$TAG" -m "Release $TAG"

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | /usr/bin/podman login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          /usr/bin/podman build \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image
        run: |
          /usr/bin/podman push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          /usr/bin/podman push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Push tag
        run: git push origin "$TAG"

      - name: Create Forgejo release
        run: |
          set -eu

          api="https://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}/releases"

          payload="$(python3 <<'PY'
          import json
          import os

          tag = os.environ["TAG"]
          image = f"{os.environ['REGISTRY']}/{os.environ['GITHUB_REPOSITORY']}:{tag}"
          prerelease = os.environ.get("INPUT_PRERELEASE", "false").lower() == "true"

          print(json.dumps({
              "tag_name": tag,
              "target_commitish": "main",
              "name": tag,
              "body": f"Container image:\n\n`{image}`",
              "draft": False,
              "prerelease": prerelease,
          }))
          PY
          )"

          curl --fail-with-body \
            -X POST "$api" \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload"
