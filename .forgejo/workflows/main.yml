name: Build and push main image

on:
  push:
    branches:
      - main

env:
  REGISTRY: git.tia.sh
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  docker:
    runs-on: linux

    steps:
      - name: Check out repository
        run: git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git .

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | podman login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: podman build -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:main .

      - name: Push image
        run: podman push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:main
