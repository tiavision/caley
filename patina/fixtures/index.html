<!doctype html>
<html lang="en" data-pt-pairing="editorial">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@tiaforge-ui/patina: every attribute and the avatar</title>
</head>
<body data-pt-surface="mesh" data-pt-grain>
  <main data-layout="stack" data-gap="xl" data-pad="lg">
    <header data-pt-hero>
      <h1 data-pt-display="hero" data-pt-ink="gradient">Patina</h1>
      <p data-muted>An expressive surface layer for temper.</p>
      <button data-pt-halo>Get started</button>
    </header>

    <section data-layout="grid" data-pt-bento data-gap="md" style="--tm-min: 10rem">
      <article data-pt-surface="glass" data-pt-span="large" data-layout="stack" data-gap="xs">
        <data data-pt-figure value="128">128</data>
        <span data-caption>People</span>
      </article>
      <article data-pt-surface="gradient" data-pt-span="wide" data-pt-elevation="raised">
        <h2 data-pt-display="lg">Wide tile</h2>
      </article>
      <article data-pt-span="tall" data-pt-elevation="floating"><p>Tall tile</p></article>
      <article data-pt-span="full" data-pt-grain><p>Full row</p></article>
      <article data-layout="row" data-gap="sm">
        <span data-avatar data-pt-seed="3">AB</span>
        <span data-avatar data-pt-seed="11" data-pt-halo>CD</span>
      </article>
    </section>

    <section data-pt-pairing="grotesk" data-layout="stack" data-gap="md">
      <h2 data-pt-display="xl">Avatars</h2>
      <!-- initials on a seeded gradient, a photo, every size -->
      <div data-layout="row" data-gap="md" data-sn-state="{ people: ['Ada Lovelace', 'Grace Hopper', 'Alan Turing', ''] }">
        <template data-sn-for="p in people">
          <pt-avatar data-sn-with="{ name: p }"></pt-avatar>
        </template>
        <pt-avatar data-sn-with="{ name: 'Photo', src: '/photo.jpg', size: 'sm' }"></pt-avatar>
        <pt-avatar data-sn-with="{ name: 'Large', size: 'lg', halo: true }"></pt-avatar>
        <pt-avatar data-sn-with="{ name: 'Profile', size: 'xl' }"></pt-avatar>
        <span data-avatar data-sn-attr="{ 'data-pt-seed': patina.seed('Ada') }" data-sn-text="patina.initials('Ada Lovelace')"></span>
      </div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
