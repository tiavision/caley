name: Image

# The container image on GitHub's registry, ghcr.io/<owner>/caley: `main` on every push to main; the
# Release workflow calls it for a release's tags (v1.3.0, and latest unless it is a pre-release).

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: the commit to build
        type: string
        required: true
      tags:
        description: the image tags, space-separated
        type: string
        required: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: tags
        env:
          TAGS: ${{ inputs.tags || 'main' }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          image="ghcr.io/${OWNER,,}/${NAME,,}"
          {
            echo "list<<EOF"
            for tag in $TAGS; do echo "$image:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      # the Dockerfile builds the backend for x86_64 (musl), so the image is linux/amd64
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
